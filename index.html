<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060716">
  <title>Neon Glider</title>
  <link id="game-icon" rel="icon" href="data:,">
  <script async src="https://unpkg.com/@vkontakte/vk-bridge@2/dist/browser.min.js"></script>
  <style>
:root {
  color-scheme: dark;
  --bg: #060716;
  --text: #f1f7ff;
  --muted: #bac7de;
  --cyan: #78f5ff;
  font-family: "Segoe UI", system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#game-container {
  position: fixed;
  inset: 0;
  margin: auto;
  width: min(100vw, 200vh);
  height: min(100vh, 200vw);
  width: min(100vw, 200dvh);
  height: min(100dvh, 200vw);
  --safe-top: max(env(safe-area-inset-top, 0px), var(--vk-inset-top, 0px));
  --safe-right: max(env(safe-area-inset-right, 0px), var(--vk-inset-right, 0px));
  --safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--vk-inset-bottom, 0px));
  --safe-left: max(env(safe-area-inset-left, 0px), var(--vk-inset-left, 0px));
  overflow: hidden;
  outline: none;
}

#game { display: block; width: 100%; height: 100%; touch-action: none; }

h1, h2, p { margin: 0; }

.menu {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-start;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  --menu-x: clamp(18px, 6vw, 100px);
  --menu-y: var(--menu-x);
  padding: max(var(--menu-y), calc(var(--safe-top) + 58px)) max(var(--menu-x), var(--safe-right))
           max(var(--menu-y), var(--safe-bottom)) max(var(--menu-x), var(--safe-left));
  background: linear-gradient(90deg, #060716 3%, #08091be8 30%, #08091b40 57%, transparent 82%);
}

.menu__home, .menu__selection { width: min(100%, 385px); margin-block: auto; }
.menu__home h1 {
  font: italic 900 clamp(3.2rem, 8vw, 9rem)/0.84 "Segoe UI", system-ui, sans-serif;
  letter-spacing: -0.075em;
  text-transform: uppercase;
  color: #effbff;
  text-shadow: 0 0 0.18em #56c7ff67;
}

.menu__track {
  margin: 1.45rem 0 1rem;
  font-weight: 650;
  color: var(--cyan);
  min-height: 1.35em;
}

.menu__actions, .choice-list { display: grid; gap: 8px; }
.menu__actions { grid-template-columns: 1fr 1fr; }
.menu__actions .button--primary { grid-column: 1 / -1; justify-content: space-between; }

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  gap: 0.5em;
  padding: 9px 14px;
  border-radius: 9px;
  border: 1px solid #536f9b;
  background: #101831;
  color: var(--text);
  font: 650 1rem/1.2 "Segoe UI", system-ui, sans-serif;
  cursor: pointer;
  touch-action: manipulation;
}

.button:hover { background: #1b2c51; border-color: var(--cyan); }
.button:active { transform: translateY(1px); }
.button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.button:disabled { opacity: .55; cursor: default; }
.button--primary { background: #96f6ff; color: #0b182e; border-color: #c8fbff; }
.button--primary:hover { background: #c0faff; }
.button--back { min-height: 38px; margin-bottom: 12px; }

.menu__selection h2 { margin-bottom: 12px; font-size: clamp(1.55rem, 3vw, 2.5rem); }
.choice-list .button { justify-content: space-between; text-align: left; }
.choice-list .button > span:first-child { min-width: 0; }
.choice-list small { display: block; margin-top: 3px; color: var(--muted); font-weight: 450; }
.choice-list small:empty { display: none; }
.choice-list .button[aria-pressed="true"] { background: #163053; border-color: var(--cyan); }
.choice-list .swatch {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--swatch) 50%, var(--accent) 50%);
}
.choice-status { font-size: .8rem; color: var(--cyan); }
.controls { margin-top: 1rem; font-size: .82rem; line-height: 1.52; color: var(--muted); }
.controls--touch { display: none; }

.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: max(16px, calc(var(--safe-top) + 56px)) max(16px, var(--safe-right))
           max(16px, var(--safe-bottom)) max(16px, var(--safe-left));
  background: #050716a8;
  text-align: center;
}
.overlay__panel {
  width: min(100%, 340px);
  display: grid;
  gap: 11px;
  border: 1px solid #657fa2;
  border-radius: 15px;
  padding: 24px;
  background: #0d142c;
}
.overlay h2 { font-size: clamp(1.5rem, 5vw, 2.25rem); }
.overlay p { color: var(--muted); line-height: 1.5; white-space: pre-line; }

.hud-controls {
  position: absolute;
  top: max(10px, var(--safe-top));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 7;
}
.button--icon {
  min-width: 40px;
  min-height: 40px;
  padding: 0;
  border-radius: 50%;
  background: #0d1738ee;
  font-size: 1rem;
}
.menu__wallet, .selection-wallet {
  display: inline-flex;
  align-items: center;
  gap: 0.35em;
  margin-bottom: 0.9rem;
  padding: 5px 11px;
  border-radius: 999px;
  border: 1px solid #ffdf7855;
  background: #1a1834cc;
  color: #ffdf78;
  font: 700 0.92rem/1.2 "Segoe UI", system-ui, sans-serif;
  text-shadow: 0 0 10px #ffdf7866;
}
.selection-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
.selection-header h2 { margin-bottom: 0; }
.selection-wallet { margin-bottom: 0; font-size: 0.86rem; }
.choice-list .choice-price {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.82rem;
  font-weight: 700;
  color: #ffdf78;
}
.choice-list .button[data-locked="false"] .choice-price {
  color: var(--cyan);
}
.choice-list .button[data-locked="true"] {
  border-color: #4f4b78;
  opacity: 0.94;
}
.choice-list .button[data-preview="true"] {
  border-color: #ffdf78;
  box-shadow: 0 0 14px #ffdf7844;
}
.buy-bar {
  position: sticky;
  bottom: 0;
  z-index: 3;
  margin-top: 10px;
  padding: 10px 0 4px;
  display: grid;
  gap: 6px;
  background: linear-gradient(180deg, #06071600, #060716ea 26%, #060716);
}
.buy-hint {
  font-size: 0.8rem;
  color: #ff9f7f;
  text-align: center;
  min-height: 1.1em;
}

@media (pointer: coarse) {
  .controls--desktop { display: none; }
  .controls--touch { display: block; }
}

@media (max-aspect-ratio: 1/1) {
  .menu {
    align-items: flex-start;
    --menu-x: clamp(14px, 5vw, 38px);
    background: linear-gradient(0deg, #060716 2%, #08091bf5 30%, #08091b60 56%, transparent 75%);
  }
  .menu__home, .menu__selection { margin-top: auto; margin-bottom: 0; margin-inline: auto; }
  .menu__home h1 br { display: none; }
  .menu__home h1 { font-size: clamp(2.4rem, 10vw, 4.2rem); }
  .menu__track { margin-top: .75rem; }
}

@media (max-height: 440px) {
  .menu { --menu-x: clamp(12px, 4vw, 48px); --menu-y: 12px; }
  .menu__home h1 { font-size: clamp(2.1rem, 13dvh, 3.5rem); }
  .menu__track { margin: .55rem 0; }
  .controls { margin-top: .5rem; }
  .menu__selection h2 { margin-bottom: 6px; }
  .button--back { margin-bottom: 6px; }
  .choice-list { grid-template-columns: 1fr 1fr; gap: 5px; }
  .choice-list .button { min-height: 36px; padding: 5px 8px; font-size: .84rem; }
  .choice-status { display: none; }
  .overlay__panel { padding: 12px; gap: 8px; }
}

.appearance-tabs, .effect-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.appearance-tabs { margin-bottom: 10px; }
.appearance-tabs .button[aria-pressed="true"] {
  color: #101d33;
  background: #96f6ff;
  border-color: #c8fbff;
}
.effect-list label {
  min-width: 0;
  display: grid;
  gap: 5px;
  padding: 9px;
  border-radius: 9px;
  background: #101831;
  border: 1px solid #4c638a;
  color: var(--muted);
  font-size: .84rem;
}
.effect-list select {
  width: 100%;
  min-width: 0;
  min-height: 38px;
  border: 1px solid #667b9f;
  border-radius: 6px;
  padding-inline: 5px;
  font: 600 .88rem "Segoe UI", system-ui, sans-serif;
  color: var(--text);
  background: #172645;
  cursor: pointer;
  touch-action: manipulation;
}
.effect-list select:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

@media (max-height: 440px) {
  .appearance-tabs { margin-bottom: 5px; gap: 5px; }
  .appearance-tabs .button { min-height: 32px; padding: 5px 8px; }
  .effect-list { gap: 5px; }
  .effect-list label { padding: 5px; }
  .effect-list select { min-height: 31px; }
}

/* ===== Visual polish: neon minimal ===== */
:root {
  --pink: #ff5fd2;
  --glow: 0 0 12px #78f5ff55, 0 0 32px #78f5ff22;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
}

/* Виньетка перенесена в запечённый 256×256 спрайт на canvas — без лишнего CSS-слоя композитора */

.menu__home h1 {
  background: linear-gradient(100deg, #effbff 20%, var(--cyan) 55%, var(--pink) 95%);
  background-size: 220% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: none;
  filter: drop-shadow(0 0 14px #56c7ff66) drop-shadow(0 0 36px #ff5fd222);
  animation: title-in .9s var(--ease-out) both, title-shift 8s ease-in-out 1s infinite alternate, flicker 6s linear 1.2s infinite;
}
@keyframes title-in { from { opacity: 0; transform: translateX(-24px) skewX(-8deg); letter-spacing: .02em; } }
@keyframes title-shift { to { background-position: 100% 0; } }
@keyframes flicker {
  0%, 92%, 100% { opacity: 1; }
  93% { opacity: .55; } 94% { opacity: 1; } 96% { opacity: .75; } 97% { opacity: 1; }
}

.menu__track { text-shadow: 0 0 10px #78f5ff88; animation: rise .6s var(--ease-out) .15s both; }
.menu__track::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: .55em; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); vertical-align: .12em; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; transform: scale(.7); } }

@keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } }
.menu__actions > *, .choice-list > *, .effect-list > *, .appearance-tabs > *, .controls, .menu__selection h2, .button--back {
  animation: rise .5s var(--ease-out) both;
}
.menu__actions > :nth-child(1) { animation-delay: .22s; }
.menu__actions > :nth-child(2) { animation-delay: .3s; }
.menu__actions > :nth-child(3) { animation-delay: .36s; }
.controls { animation-delay: .45s; }
.menu__selection h2 { animation-delay: .05s; }
.choice-list > :nth-child(1), .effect-list > :nth-child(1) { animation-delay: .1s; }
.choice-list > :nth-child(2), .effect-list > :nth-child(2) { animation-delay: .15s; }
.choice-list > :nth-child(3), .effect-list > :nth-child(3) { animation-delay: .2s; }
.choice-list > :nth-child(4), .effect-list > :nth-child(4) { animation-delay: .25s; }
.choice-list > :nth-child(5), .effect-list > :nth-child(5) { animation-delay: .3s; }
.choice-list > :nth-child(n+6), .effect-list > :nth-child(n+6) { animation-delay: .35s; }

.button {
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, #121c3bcc, #0b1229cc);
  border-color: #3d5680;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: transform .18s var(--ease-out), box-shadow .25s, border-color .25s, background .25s, color .25s;
}
.button::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 30%, #ffffff2e 50%, transparent 70%);
  transform: translateX(-120%);
  transition: transform .6s var(--ease-out);
  pointer-events: none;
}
.button:hover:not(:disabled) {
  background: linear-gradient(180deg, #1a2a52, #111c3c);
  border-color: var(--cyan);
  box-shadow: var(--glow), inset 0 0 12px #78f5ff1a;
  transform: translateY(-1px);
}
.button:hover:not(:disabled)::after { transform: translateX(120%); }
.button:active:not(:disabled) { transform: translateY(1px) scale(.985); box-shadow: 0 0 6px #78f5ff55; }
.button--primary {
  background: linear-gradient(100deg, #96f6ff, #c8fbff 60%, #ffc2ef);
  color: #0b182e;
  border-color: #d8fdff;
  box-shadow: 0 0 18px #78f5ff55;
}
.button--primary:not(:disabled) { animation: breathe 2.8s ease-in-out 1s infinite; }
.menu__actions .button--primary:not(:disabled) { animation: rise .5s var(--ease-out) .22s both, breathe 2.8s ease-in-out 1s infinite; }
.button--primary:hover:not(:disabled) { color: #0b182e; background: linear-gradient(100deg, #b8faff, #e4feff 60%, #ffd6f4); box-shadow: 0 0 26px #78f5ffaa, 0 0 60px #ff5fd233; }
.button--buy {
  background: linear-gradient(100deg, #ffd86b, #ffae42);
  color: #1c1205;
  border-color: #fff0b3;
  box-shadow: 0 0 18px #ffd15b44;
}
.button--buy:hover:not(:disabled) {
  background: linear-gradient(100deg, #ffe694, #ffc46b);
  color: #1c1205;
  border-color: #fff7d6;
  box-shadow: 0 0 24px #ffd15b88;
}
.button--buy:disabled {
  opacity: 0.72;
  background: linear-gradient(100deg, #5d4f38, #443929);
  color: #f3e4c3;
  border-color: #8c7754;
  box-shadow: none;
}
.button--revive {
  background: linear-gradient(100deg, #ffd86b, #ff8f5c);
  color: #1c1006;
  border-color: #ffe9a8;
  box-shadow: 0 0 18px #ffae4255;
}
.button--revive:hover:not(:disabled) {
  background: linear-gradient(100deg, #ffe799, #ffaa7d);
  color: #1c1006;
  border-color: #fff6d1;
  box-shadow: 0 0 26px #ffae4299;
}
.button--icon {
  background: #0d1738ee;
  color: var(--text);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
.button.button--settings {
  position: absolute;
  top: max(12px, var(--safe-top));
  right: max(12px, var(--safe-right));
  left: auto;
  min-width: 36px;
  min-height: 36px;
  width: 36px;
  height: 36px;
  font-size: 1.05rem;
  line-height: 1;
  z-index: 8;
}
.button--icon[aria-pressed="false"] {
  opacity: 0.55;
  border-color: #3d5680;
}
.button--double {
  background: linear-gradient(100deg, #68ffc3, #38efff);
  color: #091d24;
  border-color: #c2fff0;
  box-shadow: 0 0 18px #68ffc344;
}
.button--double:hover:not(:disabled) {
  background: linear-gradient(100deg, #94ffd5, #7cf5ff);
  color: #091d24;
  border-color: #e2fff8;
  box-shadow: 0 0 24px #68ffc388;
}
.button--primary span { transition: transform .25s var(--ease-out); }
.button--primary:hover span { transform: translate(3px, -3px); }
@keyframes breathe { 50% { box-shadow: 0 0 28px #78f5ff99, 0 0 50px #ff5fd222; } }

.choice-list .button[aria-pressed="true"] {
  background: linear-gradient(180deg, #1a355b, #122544);
  border-color: var(--cyan);
  box-shadow: var(--glow), inset 3px 0 0 var(--cyan);
}
.appearance-tabs .button[aria-pressed="true"],
.appearance-tabs .button[aria-pressed="true"]:hover:not(:disabled) {
  color: #0b182e;
  background: linear-gradient(100deg, #96f6ff, #c8fbff);
  border-color: #d8fdff;
  box-shadow: var(--glow);
}
.appearance-tabs .button[aria-pressed="true"]:hover:not(:disabled) {
  background: linear-gradient(100deg, #b8faff, #e4feff);
}
.choice-list .swatch { box-shadow: 0 0 10px var(--swatch), 0 0 0 2px #ffffff22; transition: transform .25s var(--ease-out); }
.choice-list .button:hover .swatch { transform: rotate(45deg) scale(1.1); }

.effect-list label { background: linear-gradient(180deg, #121c3bcc, #0b1229cc); border-color: #3d5680; transition: border-color .25s, box-shadow .25s; }
.effect-list label:hover, .effect-list label:focus-within { border-color: var(--cyan); box-shadow: var(--glow); }
.effect-list select { background: #0e1a35; border-color: #3d5680; transition: border-color .2s; }
.effect-list select:hover { border-color: var(--cyan); }

.overlay { background: #050716b0; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); animation: fade .3s ease both; }
.overlay__panel {
  position: relative;
  background: linear-gradient(180deg, #0f1733f0, #0a0f24f0);
  border-color: #78f5ff66;
  box-shadow: 0 0 0 1px #ff5fd215, 0 0 30px #78f5ff33, 0 20px 60px #000a;
  animation: pop .45s var(--ease-out) both;
}
.overlay__panel::before {
  content: "";
  position: absolute;
  left: 18%; right: 18%; top: -1px;
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
  box-shadow: 0 0 12px var(--cyan);
}
.overlay h2 { text-shadow: 0 0 14px #78f5ff88; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.94); } }

.menu, .overlay { z-index: 6; }
.menu { animation: fade .4s ease both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* PERF: blur поверх анимированного canvas пересчитывается каждый кадр — на слабых GPU это главный тормоз меню */
body.perf-lite *, body.perf-lite *::before, body.perf-lite *::after {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}
body.perf-lite .overlay { background: #050716d8; }
body.perf-lite .button { background: linear-gradient(180deg, #121c3be6, #0b1229e6); }

  </style>
</head>
<body>
  <main id="game-container" tabindex="-1" aria-label="Neon Glider">
    <canvas id="game" aria-label="Неоновая трасса и глайдер"></canvas>
    <section id="menu" class="menu">
      <button id="open-settings" class="button button--icon button--settings" type="button" aria-label="Настройки" title="Настройки" disabled>⚙</button>
      <div class="menu__home">
        <h1>Neon <br>Glider</h1>
        <p id="menu-track" class="menu__track" role="status">Загрузка игры…</p>
        <p id="menu-wallet" class="menu__wallet" aria-label="Монеты">● 0</p>
        <div class="menu__actions">
          <button id="play" class="button button--primary" type="button" disabled>Играть <span aria-hidden="true">↗</span></button>
          <button id="open-levels" class="button" type="button" disabled>Уровни</button>
          <button id="open-skins" class="button" type="button" disabled>Скины</button>
        </div>
        <p class="controls controls--desktop">← → сменить полосу · Пробел прыгнуть<br>Снова Пробел в воздухе — кувырок · ↓ подкат · P пауза · M звук · N музыка</p>
        <p id="controls-touch-hint" class="controls controls--touch">Свайпы ← → смена полосы · ↑ или двойной тап — прыжок<br>Ещё раз ↑ в воздухе — кувырок · ↓ подкат<br>В «Сетке 3×3» свайпы по всем 9 ячейкам</p>
      </div>
      <section id="selection" class="menu__selection" aria-labelledby="selection-title" hidden>
        <button id="menu-back" class="button button--back" type="button">← В меню</button>
        <div class="selection-header">
          <h2 id="selection-title"></h2>
          <span id="selection-wallet" class="selection-wallet" hidden>● 0</span>
        </div>
        <div id="level-list" class="choice-list" hidden></div>
        <div id="appearance-tabs" class="appearance-tabs" role="group" aria-label="Внешний вид" hidden>
          <button id="skin-tab" class="button" type="button" aria-controls="skin-list">Модели</button>
          <button id="effects-tab" class="button" type="button" aria-controls="effect-list">Эффекты</button>
        </div>
        <div id="effect-list" class="effect-list" hidden></div>
        <div id="skin-list" class="choice-list" hidden></div>
        <div id="settings-list" class="choice-list" hidden>
          <button id="open-controls" class="button" type="button">
            <span>Управление<small id="settings-controls-value">Свайпы</small></span>
            <span class="choice-status" aria-hidden="true">→</span>
          </button>
          <button id="sound-toggle" class="button" type="button" aria-pressed="true">

  </main>
<script>
(() => {
  var deepFreeze = (obj) => {
    Object.values(obj).forEach((value) => {
      if (value && typeof value === "object") deepFreeze(value);
    });
    return Object.freeze(obj);
  };
  var CONFIG = deepFreeze({
    debug: false,
    loop: {
      maxDt: 0.125
    },
    camera: {
      height: 4,
      playerZ: 8,
      nearZ: 1.5,
      farZ: 90,
      horizonRatio: 0.36,
      focalByWidth: 1.1,
      focalByHeight: 1,
      followX: 0.35,
      roofLift: 1.15,
      roofZoomOut: 0.045,
      roofRiseRate: 13,
      roofFallRate: 9
    },
    track: {
      laneCount: 3,
      laneWidth: 2.2,
      segmentLength: 4,
      pylonSpacing: 12,
      pylonHeight: 3.2,
      pylonOffset: 1,
      sideGridLines: 8,
      sideGridStep: 4
    },
    speed: {
      idle: 3.5,
      difficultyTimeScale: 1.2
    },
    player: {
      startLane: 1,
      laneChangeRate: 16,
      tiltMax: 0.38,
      tiltRate: 14,
      gravity: 44,
      jumpVelocity: 14,
      fastFallVelocity: 26,
      trickDuration: 0.33,
      trickFlightMultiplier: 1.4,
      slideDuration: 0.65,
      slideBlendRate: 28,
      landRecoverTime: 0.18,
      coyoteTime: 0.085,
      jumpBufferTime: 0.12,
      width: 1.08,
      height: 1.1,
      slideHeight: 0.5
    },
    obstacles: {
      firstRowAt: 40,
      depth: 1,
      gapTime: 1.15,
      minGap: 12,
      maxGap: 44,
      minReactionTime: 0.25,
      laneSwitchTime: 0.12,
      coinChance: 0.7
    },
    game: {
      coinScore: 20,
      trickScore: 40,
      nearMissScore: 15,
      restartDelay: 0.7,
      crashDuration: 1.05,
      winDuration: 1.15,
      reviveCost: 50,
      storageKey: "neonGlider.best"
    },
    powerups: {
      magnetDuration: 7.5,
      nitroDuration: 4.2,
      nitroSpeedBonus: 7.5,
      shieldGrace: 1.2,
      reviveGrace: 2.0,
      spawnChance: 0.36,
      minRowGap: 5
    },
    dayCycle: {
      firstSunsetScore: 7000,
      menuDuration: 95
    },
    controls: {
      swipeThreshold: 22,
      tapMaxTime: 250,
      tapMoveTolerance: 14,
      doubleTapInterval: 300,
      doubleTapDistance: 48,
      doubleTapAction: "jump",
      keys: {
        left: ["ArrowLeft", "KeyA"],
        right: ["ArrowRight", "KeyD"],
        jump: ["ArrowUp", "KeyW", "Space"],
        slide: ["ArrowDown", "KeyS"],
        pause: ["KeyP", "Escape"],
        tap: ["Enter"],
        mute: ["KeyM"],
        music: ["KeyN"]
      }
    },
    colors: {
      laneLine: "#00f0ff",
      pylon: "#00f0ff",
      text: "#e8f6ff",
      step: "#81ffc8",
      barrier: "#ff2bd6",
      beam: "#ff9f43",
      block: "#ff3b5c",
      shield: "#42f5ff",
      magnet: "#ff5fd2",
      nitro: "#ffd15b"
    }
  });

  /* ==================== Синтезатор звука (Web Audio API) ==================== */
  class SoundEngine {
    constructor(enabled = true, musicEnabled = true) {
      this.enabled = enabled;
      this.musicEnabled = musicEnabled;
      this.ctx = null;
      this.master = null;
      this.engineOsc = null;
      this.engineSub = null;
      this.engineGain = null;
      this.engineFilter = null;
      this.musicFilter = null;
      this.musicGain = null;
      this.musicNextTime = 0;
      this.musicStep = 0;
      this.noiseBuffer = null;
      this.coinStreak = 0;
      this.lastCoinTime = 0;
    }

    init() {
      if (!this.enabled) return false;
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return false;
        this.ctx = new AudioCtx();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.34;
        this.master.connect(this.ctx.destination);
        this.noiseBuffer = this.createNoiseBuffer();
        this.setupEngineHum();
        this.setupMusicBus();
      }
      if (this.ctx.state === "suspended") {
        this.ctx.resume().catch(() => {});
      }
      return true;
    }

    suspend() {
      if (this.ctx && this.ctx.state === "running") this.ctx.suspend().catch(() => {});
    }

    setupMusicBus() {
      const now = this.ctx.currentTime;
      this.musicFilter = this.ctx.createBiquadFilter();
      this.musicFilter.type = "lowpass";
      this.musicFilter.frequency.setValueAtTime(340, now);
      this.musicFilter.Q.setValueAtTime(1.8, now);

      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.setValueAtTime(0.0001, now);

      this.musicFilter.connect(this.musicGain);
      this.musicGain.connect(this.master);
    }

    setMusicEnabled(flag) {
      this.musicEnabled = flag;
      if (!flag) {
        this.updateMusic(false);
      } else if (this.enabled) {
        this.init();
      }
    }

    updateMusic(active, speed = 11, musicCfg = null) {
      if (!this.ctx || !this.musicGain || !this.musicFilter) return;
      const now = this.ctx.currentTime;
      if (!this.enabled || !this.musicEnabled || !active || this.ctx.state !== "running") {
        this.musicGain.gain.setTargetAtTime(0.0001, now, 0.08);
        this.musicNextTime = 0;
        return;
      }
      const normSpeed = Math.max(0, Math.min(1, (speed - 10) / 17));
      const cutoff = 300 + normSpeed * 620;
      this.musicFilter.frequency.setTargetAtTime(cutoff, now, 0.12);
      this.musicGain.gain.setTargetAtTime(0.24, now, 0.12);

      const bpmBase = musicCfg?.bpmBase ?? 112;
      const bpm = bpmBase + normSpeed * 16;
      const stepDur = 60 / bpm / 2;
      if (this.musicNextTime === 0 || this.musicNextTime < now - 0.15) {
        this.musicNextTime = now + 0.02;
      }
      const bassRoots = musicCfg?.roots ?? [55.0, 43.65, 65.41, 49.0];
      const arpOffsets = musicCfg?.arp ?? [0, 12, 7, 12, 3, 12, 7, 10];
      const bassWave = musicCfg?.bassWave ?? "sawtooth";
      const arpWave = musicCfg?.arpWave ?? "triangle";
      while (this.musicNextTime < now + 0.14) {
        const t = this.musicNextTime;
        const step = this.musicStep;
        const bar = Math.floor(step / 8) % bassRoots.length;
        const beat = step % 8;
        const root = bassRoots[bar];

        const bass = this.ctx.createOscillator();
        const bGain = this.ctx.createGain();
        bass.type = bassWave;
        bass.frequency.setValueAtTime(beat % 2 === 1 ? root * 2 : root, t);
        bGain.gain.setValueAtTime(0.001, t);
        bGain.gain.linearRampToValueAtTime(0.25, t + 0.012);
        bGain.gain.exponentialRampToValueAtTime(0.001, t + stepDur * 0.9);
        bass.connect(bGain);
        bGain.connect(this.musicFilter);
        bass.start(t);
        bass.stop(t + stepDur * 0.95);

        if (beat % 2 === 0 || normSpeed > 0.3) {
          const semi = arpOffsets[beat % arpOffsets.length];
          const arpFreq = root * 4 * Math.pow(2, semi / 12);
          const arp = this.ctx.createOscillator();
          const aGain = this.ctx.createGain();
          arp.type = arpWave;
          arp.frequency.setValueAtTime(arpFreq, t);
          aGain.gain.setValueAtTime(0.001, t);
          aGain.gain.linearRampToValueAtTime(0.09, t + 0.01);
          aGain.gain.exponentialRampToValueAtTime(0.001, t + stepDur * 0.78);
          arp.connect(aGain);
          aGain.connect(this.musicFilter);
          arp.start(t);
          arp.stop(t + stepDur * 0.82);
        }

        if (beat === 0 || beat === 4) {
          const kick = this.ctx.createOscillator();
          const kGain = this.ctx.createGain();
          kick.type = "sine";
          kick.frequency.setValueAtTime(118, t);
          kick.frequency.exponentialRampToValueAtTime(38, t + 0.09);
          kGain.gain.setValueAtTime(0.24, t);
          kGain.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
          kick.connect(kGain);
          kGain.connect(this.master);
          kick.start(t);
          kick.stop(t + 0.12);
        }

        this.musicStep = (this.musicStep + 1) % 32;
        this.musicNextTime += stepDur;
      }
    }

    playCountdown(go = false) {
      if (!this.init()) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(go ? 880 : 523.25, now);
      if (go) osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.12);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + (go ? 0.22 : 0.12));
      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);
      osc.stop(now + (go ? 0.24 : 0.13));
    }

    createNoiseBuffer() {
      const length = this.ctx.sampleRate * 1.2;
      const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      return buffer;
    }

    setupEngineHum() {
      const now = this.ctx.currentTime;
      this.engineFilter = this.ctx.createBiquadFilter();
      this.engineFilter.type = "lowpass";
      this.engineFilter.frequency.setValueAtTime(160, now);
      this.engineFilter.Q.setValueAtTime(2.2, now);

      this.engineGain = this.ctx.createGain();
      this.engineGain.gain.setValueAtTime(0.0001, now);

      this.engineOsc = this.ctx.createOscillator();
      this.engineOsc.type = "sawtooth";
      this.engineOsc.frequency.setValueAtTime(62, now);

      this.engineSub = this.ctx.createOscillator();
      this.engineSub.type = "triangle";
      this.engineSub.frequency.setValueAtTime(31, now);

      this.engineOsc.connect(this.engineFilter);
      this.engineSub.connect(this.engineFilter);
      this.engineFilter.connect(this.engineGain);
      this.engineGain.connect(this.master);

      this.engineOsc.start(now);
      this.engineSub.start(now);
    }

    updateEngine(active, speed = 11, airborne = false, sliding = false) {
      if (!this.ctx || !this.engineGain) return;
      const now = this.ctx.currentTime;
      if (!this.enabled || !active || this.ctx.state !== "running") {
        this.engineGain.gain.setTargetAtTime(0.0001, now, 0.08);
        return;
      }
      const normSpeed = Math.max(0, Math.min(1, (speed - 10) / 18));
      const baseFreq = 58 + normSpeed * 44 + (airborne ? 12 : 0) - (sliding ? 9 : 0);
      const cutoff = 150 + normSpeed * 260 + (airborne ? 90 : 0);
      const vol = 0.045 + normSpeed * 0.035;
      this.engineOsc.frequency.setTargetAtTime(baseFreq, now, 0.07);
      this.engineSub.frequency.setTargetAtTime(baseFreq * 0.5, now, 0.07);
      this.engineFilter.frequency.setTargetAtTime(cutoff, now, 0.08);
      this.engineGain.gain.setTargetAtTime(vol, now, 0.09);
    }

    setEnabled(flag) {
      this.enabled = flag;
      if (!flag) {
        this.updateEngine(false);
        this.updateMusic(false);
      } else {
        this.init();
      }
    }

    playLane(dir = 1) {
      if (!this.init()) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      const startFreq = dir > 0 ? 290 : 330;
      const endFreq = dir > 0 ? 430 : 235;
      osc.frequency.setValueAtTime(startFreq, now);
      osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.085);

      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);

      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.1);
    }

    playJump() {
      if (!this.init()) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(210, now);
      osc.frequency.exponentialRampToValueAtTime(620, now + 0.16);

      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.19);
    }

    playTrick() {
      if (!this.init()) return;
      const now = this.ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const t = now + idx * 0.036;
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.14, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.17);
      });
    }

    playSlide(fastFall = false) {
      if (!this.init() || !this.noiseBuffer) return;
      const now = this.ctx.currentTime;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.setValueAtTime(fastFall ? 1200 : 850, now);
      filter.frequency.exponentialRampToValueAtTime(280, now + 0.2);
      filter.Q.value = 1.6;

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(this.master);
      src.start(now);
      src.stop(now + 0.23);
    }

    playLand(impact = 0.5) {
      if (!this.init()) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(135 + impact * 40, now);
      osc.frequency.exponentialRampToValueAtTime(44, now + 0.11);

      gain.gain.setValueAtTime(0.15 + impact * 0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    playCoin(streak = null) {
      if (!this.init()) return;
      const now = this.ctx.currentTime;
      if (Number.isFinite(streak)) {
        this.coinStreak = Math.max(0, Math.min(streak, 10));
      } else if (now - this.lastCoinTime < 0.85) {
        this.coinStreak = Math.min(this.coinStreak + 1, 10);
      } else {
        this.coinStreak = 0;
      }
      this.lastCoinTime = now;

      const semitoneBoost = Math.pow(2, this.coinStreak / 12);
      const f1 = 880 * semitoneBoost;
      const f2 = 1318.5 * semitoneBoost;

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(f1, now);
      osc.frequency.setValueAtTime(f2, now + 0.045);

      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);

      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.2);
    }

    playNearMiss() {
      if (!this.init()) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.12);
    }

    playCrash() {
      if (!this.init()) return;
      this.updateEngine(false);
      this.updateMusic(false);
      const now = this.ctx.currentTime;

      const osc = this.ctx.createOscillator();
      const oscGain = this.ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(28, now + 0.48);
      oscGain.gain.setValueAtTime(0.32, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.connect(oscGain);
      oscGain.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.52);

      if (this.noiseBuffer) {
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(1600, now);
        filter.frequency.exponentialRampToValueAtTime(120, now + 0.55);

        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.34, now);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.56);

        src.connect(filter);
        filter.connect(nGain);
        nGain.connect(this.master);
        src.start(now);
        src.stop(now + 0.58);
      }
    }

    playWin() {
      if (!this.init()) return;
      this.updateEngine(false);
      this.updateMusic(false);
      const now = this.ctx.currentTime;
      const chord = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      chord.forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const t = now + i * 0.065;
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.4);
      });
    }

    playUi() {
      if (!this.init()) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(640, now);
      osc.frequency.exponentialRampToValueAtTime(860, now + 0.045);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.06);
    }

    playPowerup(kind) {
      if (!this.init()) return;
      const now = this.ctx.currentTime;
      const seq = kind === "nitro" ? [587.33, 880, 1174.66] : kind === "magnet" ? [493.88, 659.25, 987.77] : [440, 659.25, 880];
      seq.forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const t = now + i * 0.045;
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.16, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.22);
      });
    }

    playShieldBreak() {
      if (!this.init()) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(760, now);
      osc.frequency.exponentialRampToValueAtTime(160, now + 0.26);
      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain);
      gain.connect(this.master);
      osc.start(now);
      osc.stop(now + 0.3);
      if (this.noiseBuffer) {
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.setValueAtTime(1400, now);
        const nGain = this.ctx.createGain();

        ctx.fillStyle = outerHalo;
        ctx.fillRect(0, 0, w, horizon);

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, w, horizon);
        ctx.clip();

        // Мягкие веерные солнечные лучи (угасают вместе с вечерним ореолом)
        if (pal.twilight > 0.05) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          const rayLen = Math.max(w, h) * 0.66;
          for (let i = 0; i < 9; i++) {
            const baseA = -Math.PI + (i + 0.5) * (Math.PI / 9);
            const sway = Math.sin(time * 0.24 + i * 1.41) * 0.028;
            const a = baseA + sway;
            const spread = 0.036 + (i % 3) * 0.018;
            const pulse = 0.68 + 0.32 * Math.sin(time * 0.55 + i * 1.9);
            const rGrad = ctx.createLinearGradient(sx, haloY, sx + Math.cos(a) * rayLen, haloY + Math.sin(a) * rayLen);
            rGrad.addColorStop(0, hexAlpha(pal.rays, 0.095 * pal.twilight * sunHaloVis * pulse));
            rGrad.addColorStop(0.42, hexAlpha(pal.rays, 0.028 * pal.twilight * sunHaloVis * pulse));
            rGrad.addColorStop(1, hexAlpha(pal.rays, 0));
            ctx.fillStyle = rGrad;
            ctx.beginPath();
            ctx.moveTo(sx, haloY);
            ctx.lineTo(sx + Math.cos(a - spread) * rayLen, haloY + Math.sin(a - spread) * rayLen);
            ctx.lineTo(sx + Math.cos(a + spread) * rayLen, haloY + Math.sin(a + spread) * rayLen);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        }

        // Тонкое атмосферное кольцо-гало и анаморфный блик
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const ringPulse = 1 + 0.018 * Math.sin(time * 1.6);
        const haloRing = ctx.createRadialGradient(sx, haloY, sunR * 0.9, sx, haloY, sunR * 2.25 * ringPulse);
        haloRing.addColorStop(0, hexAlpha(pal.rays, 0.32 * sunHaloVis));
        haloRing.addColorStop(0.32, hexAlpha(pal.sun[1], 0.17 * sunHaloVis));
        haloRing.addColorStop(0.68, hexAlpha(pal.halo, 0.06 * sunHaloVis));
        haloRing.addColorStop(1, hexAlpha(pal.halo, 0));
        ctx.fillStyle = haloRing;
        ctx.beginPath();
        ctx.arc(sx, haloY, sunR * 2.25 * ringPulse, 0, TAU);
        ctx.fill();

        if (pal.twilight > 0.1) {
          const flareW = sunR * (3.6 + pal.twilight * 1.8);
          const flareH = sunR * 0.16;
          const flare = ctx.createLinearGradient(sx - flareW, haloY, sx + flareW, haloY);
          flare.addColorStop(0, hexAlpha(pal.rays, 0));
          flare.addColorStop(0.35, hexAlpha(pal.rays, 0.11 * pal.twilight * sunHaloVis));
          flare.addColorStop(0.5, hexAlpha("#fff7df", 0.24 * pal.twilight * sunHaloVis));
          flare.addColorStop(0.65, hexAlpha(pal.rays, 0.11 * pal.twilight * sunHaloVis));
          flare.addColorStop(1, hexAlpha(pal.rays, 0));
          ctx.fillStyle = flare;
          ctx.beginPath();
          ctx.ellipse(sx, haloY, flareW, flareH, 0, 0, TAU);
          ctx.fill();
        }
        ctx.restore();

        // Сам солнечный диск (уходит за горизонт, оставляя угасающий вечерний ореол)
        if (sunDiscVis > 0.005) {
          const sunDisc = ctx.createRadialGradient(sx, sy - sunR * 0.1, sunR * 0.08, sx, sy, sunR);
          sunDisc.addColorStop(0, "#fffdf5");
          sunDisc.addColorStop(0.58, pal.sun[0]);
          sunDisc.addColorStop(0.88, pal.sun[1]);
          sunDisc.addColorStop(1, pal.halo);
          ctx.globalAlpha = sunDiscVis;
          ctx.fillStyle = sunDisc;
          ctx.beginPath();
          ctx.arc(sx, sy, sunR, 0, TAU);
          ctx.fill();

          ctx.strokeStyle = hexAlpha("#fff9e6", 0.52 * sunDiscVis);
          ctx.lineWidth = Math.max(1, sunR * 0.025);
          ctx.stroke();
        }

        ctx.restore();
        ctx.globalAlpha = 1;
      }

      // 4. Луна (сначала медленно проявляется лунный ореол у горизонта, затем плавно восходит диск того же размера)
      if (moonHaloVis > 0.005) {
        const moonR = celestialR;

        // Медленно нарастающий серебристо-голубой лунный ореол
        const mHalo = ctx.createRadialGradient(mx, mHaloY, moonR * 0.35, mx, mHaloY, moonR * 4.0);
        mHalo.addColorStop(0, hexAlpha("#c4deff", 0.3 * moonHaloVis));
        mHalo.addColorStop(0.38, hexAlpha("#7aa6ff", 0.13 * moonHaloVis));
        mHalo.addColorStop(0.72, hexAlpha("#4c78d9", 0.04 * moonHaloVis));
        mHalo.addColorStop(1, hexAlpha("#4c78d9", 0));
        ctx.fillStyle = mHalo;
        ctx.fillRect(0, 0, w, horizon);

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, w, horizon);
        ctx.clip();

        // Тонкий лунный разлив вдоль горизонта при восходе
        if (moonRise < 0.45) {
          const riseGlow = (1 - moonRise / 0.45) * moonHaloVis;
          const mSpreadW = moonR * 3.4;
          const mHorizonGlow = ctx.createRadialGradient(mx, horizon, 0, mx, horizon, mSpreadW);
          mHorizonGlow.addColorStop(0, hexAlpha("#d4e8ff", 0.22 * riseGlow));
          mHorizonGlow.addColorStop(0.5, hexAlpha("#6e9bff", 0.08 * riseGlow));
          mHorizonGlow.addColorStop(1, hexAlpha("#6e9bff", 0));
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.fillStyle = mHorizonGlow;
          ctx.fillRect(0, horizon * 0.55, w, horizon * 0.46);
          ctx.restore();
        }

        if (moonDiscVis > 0.005) {
          if (level.id === "orbit") {
            ctx.save();
            ctx.translate(mx, my);
            ctx.rotate(-0.22);
            ctx.strokeStyle = hexAlpha("#cfe4ff", 0.34 * moonDiscVis);
            ctx.lineWidth = Math.max(1, moonR * 0.032);
            ctx.beginPath();
            ctx.ellipse(0, 0, moonR * 1.62, moonR * 0.28, 0, 0, TAU);
            ctx.stroke();
            ctx.restore();
          }
          ctx.globalAlpha = moonDiscVis * 0.96;
          ctx.drawImage(moonSprite, mx - moonHalf, my - moonHalf, moonHalf * 2, moonHalf * 2);
        }
        ctx.restore();
        ctx.globalAlpha = 1;
      }
      pal.celestialX = celestialX / Math.max(1, w);

      // 5. Облака рендерятся отдельным лёгким проходом поверх кэшированного неба

      // 6. Три слоя low-poly гор с воздушной перспективой и мягкой дымкой между слоями (Path2D)
      for (let layer = 0; layer < ridges.length; layer++) {
        ctx.fillStyle = pal.mountains[layer];
        if (ridgeFillPaths) {
          ctx.fill(ridgeFillPaths[layer]);
        } else {
          const pts = ridges[layer];
          ctx.beginPath();
          ctx.moveTo(0, horizon);
          for (let i = 0; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
          ctx.lineTo(w, horizon);
          ctx.closePath();
          ctx.fill();
        }

        // Тонкий контровой солнечный блик по кромке дальнего и среднего хребта
        if (layer < 2 && (pal.twilight > 0.12 || pal.brightness > 0.7)) {
          ctx.strokeStyle = hexAlpha(pal.ridgeRim, (0.28 * pal.twilight + 0.12 * pal.brightness) * (layer === 0 ? 0.9 : 0.55));
          ctx.lineWidth = layer === 0 ? 1.4 : 1.0;
          if (ridgeStrokePaths) {
            ctx.stroke(ridgeStrokePaths[layer]);
          } else {
            const pts = ridges[layer];
            ctx.beginPath();
            ctx.moveTo(pts[0][0], pts[0][1]);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
            ctx.stroke();
          }
        }

        // Слой светящейся дымки у подножия хребтов (атмосферная глубина Race the Sun)
        if (layer < 2) {
          const mistH = horizon * (layer === 0 ? 0.26 : 0.15);
          const mist = ctx.createLinearGradient(0, horizon - mistH, 0, horizon);
          mist.addColorStop(0, hexAlpha(pal.fog, 0));
          mist.addColorStop(1, hexAlpha(pal.fog, (layer === 0 ? 0.28 : 0.15) * (0.45 + 0.55 * (1 - pal.night))));
          ctx.fillStyle = mist;
          ctx.fillRect(0, horizon - mistH, w, mistH);
        }
      }

      // 7. Минималистичные геометрические монолиты на горизонте (Path2D)
      const monoColor = pal.monolith;
      const monoRimAlpha = clamp2(0.18 + pal.night * 0.7 + pal.twilight * 0.4, 0.15, 0.9);
      if (monolithPath) {
        ctx.fillStyle = monoColor;
        ctx.fill(monolithPath);
        ctx.fillStyle = hexAlpha(pal.night > 0.45 ? COL.pylon : pal.ridgeRim, monoRimAlpha * 0.65);
        ctx.fill(monolithLitPath);
      } else {
        for (let i = 0; i < monoliths.length; i++) {
          const m = monoliths[i];
          const l = m.x - m.bw * 0.5, r = m.x + m.bw * 0.5, top = horizon - m.bh;
          ctx.fillStyle = monoColor;
          ctx.beginPath();
          if (m.shape === 1) { ctx.moveTo(l, horizon); ctx.lineTo(m.x, top); ctx.lineTo(r, horizon); }
          else if (m.shape === 0) { ctx.moveTo(l, horizon); ctx.lineTo(l, top + Math.max(0, m.slant)); ctx.lineTo(r, top + Math.max(0, -m.slant)); ctx.lineTo(r, horizon); }
          else { ctx.moveTo(l, horizon); ctx.lineTo(l, top); ctx.lineTo(r, top); ctx.lineTo(r, horizon); }
          ctx.closePath();
          ctx.fill();
          if (m.lit) {
            ctx.fillStyle = hexAlpha(pal.night > 0.45 ? COL.pylon : pal.ridgeRim, monoRimAlpha * 0.65);
            ctx.fillRect(m.x - 0.75, top + m.bh * 0.18, 1.5, m.bh * 0.24);
          }
        }
      }

      // 8. Горизонтальный световой разлив (угасает вместе с вечерним ореолом солнца)
      if (sunHaloVis > 0.02 && (pal.twilight > 0.05 || pal.brightness > 0.6)) {
        const glare = ctx.createRadialGradient(sx, horizon, 0, sx, horizon, w * 0.44);
        const glareStrength = (0.18 * pal.twilight + 0.07 * pal.brightness) * sunHaloVis;
        glare.addColorStop(0, hexAlpha("#fff0c8", glareStrength));
        glare.addColorStop(0.35, hexAlpha(pal.halo, glareStrength * 0.5));
        glare.addColorStop(1, hexAlpha(pal.halo, 0));
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = glare;
        ctx.fillRect(0, horizon * 0.48, w, horizon * 0.53);
        ctx.restore();
      }

      // 9. Земля, дорога и туман горизонта в тон времени суток
      const ground = ctx.createLinearGradient(0, horizon, 0, h);
      ground.addColorStop(0, pal.ground[0]);
      ground.addColorStop(0.3, pal.ground[1]);
      ground.addColorStop(1, pal.ground[2]);
      ctx.fillStyle = ground;
      ctx.fillRect(0, horizon, w, h - horizon);

      this.roadPaint = this.ctx.createLinearGradient(0, horizon, 0, h);
      this.roadPaint.addColorStop(0, pal.road[0]);
      this.roadPaint.addColorStop(0.36, pal.road[1]);
      this.roadPaint.addColorStop(1, pal.road[2]);

      this.fog = this.ctx.createLinearGradient(0, horizon, 0, horizon + h * 0.2);
      this.fog.addColorStop(0, hexAlpha(pal.fog, 0.58));
      this.fog.addColorStop(0.45, hexAlpha(pal.fog, 0.18));
      this.fog.addColorStop(1, hexAlpha(pal.fog, 0));

      this.roadSheen = this.ctx.createLinearGradient(0, horizon, 0, h);
      this.roadSheen.addColorStop(0, hexAlpha(pal.rays, 0.17 * pal.twilight + 0.09 * (1 - pal.twilight)));
      this.roadSheen.addColorStop(0.42, hexAlpha(pal.halo, 0.07 * pal.twilight + 0.03));
      this.roadSheen.addColorStop(1, hexAlpha(pal.halo, 0));

      this.warmWash = this.ctx.createLinearGradient(0, horizon * 0.4, 0, h);
      this.warmWash.addColorStop(0, hexAlpha(pal.halo, 0.02 * pal.twilight));
      this.warmWash.addColorStop(0.32, hexAlpha(pal.rays, 0.06 * pal.twilight));
      this.warmWash.addColorStop(1, hexAlpha(pal.halo, 0.01 * pal.twilight));
    }
    createCoin() {
      this.coin.width = this.coin.height = 64;
      const ctx = this.coin.getContext("2d");
      const glow = ctx.createRadialGradient(32, 32, 12, 32, 32, 32);
      glow.addColorStop(0, "#ffe275");
      glow.addColorStop(1, "#ffb90000");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, 64, 64);
      const face2 = ctx.createLinearGradient(22, 10, 42, 54);
      face2.addColorStop(0, "#fff7bc");
      face2.addColorStop(1, "#ffae35");
      ctx.fillStyle = face2;
      ctx.strokeStyle = "#fff6aa";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(32, 32, 21, 0, TAU);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = "#a85b16";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(32, 32, 16, 0, TAU);
      ctx.stroke();
      polygon(ctx, [33, 20, 23, 34, 30, 34, 30, 44, 41, 29, 34, 29]);
      ctx.fillStyle = "#ad5a13";
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = "#ffef9b";
      ctx.stroke();
    }
    createSprites() {
      // 1. Знак «СТОП» для красных барьеров (64×64)
      const stop = document.createElement("canvas");
      stop.width = stop.height = 64;
      const sc = stop.getContext("2d");
      const cx = 32, cy = 32, sz = 25;
      polygon(sc, [
        cx - sz * 0.4, cy - sz, cx + sz * 0.4, cy - sz,
        cx + sz, cy - sz * 0.4, cx + sz, cy + sz * 0.4,
        cx + sz * 0.4, cy + sz, cx - sz * 0.4, cy + sz,
        cx - sz, cy + sz * 0.4, cx - sz, cy - sz * 0.4
      ]);
      sc.fillStyle = COL.block;
      sc.fill();
      sc.strokeStyle = "#fff1fb";
      sc.lineWidth = 2.8;
      sc.stroke();
      sc.fillStyle = "#fff1fb";
      sc.fillRect(cx - sz * 0.6, cy - sz * 0.16, sz * 1.2, sz * 0.32);
      this.stopSprite = stop;

      // 2. Спрайты стрелок препятствий (вверх/вниз для каждого цвета)
      this.arrowSprites = {};
      const makeArrow = (dir, color) => {
        const c = document.createElement("canvas");
        c.width = c.height = 64;
        const g = c.getContext("2d");
        const s = 22;
        polygon(g, [
          32, 32 + dir * s,
          32 + s, 32 - dir * s * 0.15,
          32 + s * 0.38, 32 - dir * s * 0.15,
          32 + s * 0.38, 32 - dir * s,
          32 - s * 0.38, 32 - dir * s,
          32 - s * 0.38, 32 - dir * s * 0.15,
          32 - s, 32 - dir * s * 0.15
        ]);
        g.strokeStyle = color;
        g.lineWidth = s * 0.27;
        g.lineJoin = "round";
        g.stroke();
        g.fillStyle = "#fff5fc";
        g.fill();
        return c;
      };
      this.arrowSprites.step = makeArrow(-1, COL.step);
      this.arrowSprites.barrier = makeArrow(-1, COL.barrier);
      this.arrowSprites.beam = makeArrow(1, COL.beam);
      this.arrowSprites.cargo = makeArrow(-1, DECK_PALETTES.cargo.glow);

      // 3. Спрайты бонусов (щит, магнит, нитро)
      this.powerupSprites = {};
      for (const kind of POWERUP_TYPES) {
        const c = document.createElement("canvas");
        c.width = c.height = 96;
        const g = c.getContext("2d");
        const color = COL[kind] || "#78f5ff";
        const r = 28;
        g.globalAlpha = 0.32;
        g.fillStyle = color;
        g.beginPath();
        g.arc(48, 48, r * 1.45, 0, TAU);
        g.fill();
        g.globalAlpha = 0.94;
        g.fillStyle = "#0b142c";
        g.beginPath();
        g.arc(48, 48, r * 0.78, 0, TAU);
        g.fill();
        g.strokeStyle = "#ffffff";
        g.lineWidth = 2.4;
        g.stroke();
        g.fillStyle = color;
        g.lineWidth = 2;
        if (kind === "shield") {
          polygon(g, [48, 48 - r * 0.48, 48 + r * 0.42, 48 - r * 0.18, 48 + r * 0.28, 48 + r * 0.36, 48, 48 + r * 0.5, 48 - r * 0.28, 48 + r * 0.36, 48 - r * 0.42, 48 - r * 0.18]);
          g.fill();
          g.stroke();
        } else if (kind === "magnet") {
          g.beginPath();
          g.arc(48, 48 - r * 0.04, r * 0.34, Math.PI, 0, false);
          g.lineTo(48 + r * 0.34, 48 + r * 0.32);
          g.lineTo(48 + r * 0.16, 48 + r * 0.32);
          g.lineTo(48 + r * 0.16, 48 - r * 0.02);
          g.arc(48, 48 - r * 0.02, r * 0.16, 0, Math.PI, true);
          g.lineTo(48 - r * 0.16, 48 + r * 0.32);
          g.lineTo(48 - r * 0.34, 48 + r * 0.32);
          g.closePath();
          g.fill();
          g.stroke();
        } else {
          polygon(g, [48 + r * 0.08, 48 - r * 0.48, 48 - r * 0.32, 48 + r * 0.05, 48 - r * 0.02, 48 + r * 0.05, 48 - r * 0.12, 48 + r * 0.48, 48 + r * 0.34, 48 - r * 0.06, 48 + r * 0.04, 48 - r * 0.06]);
          g.fill();
          g.stroke();
        }
        this.powerupSprites[kind] = c;
      }

      // 4. Спрайт защитной сферы щита вокруг корабля (128×128)
      const sb = document.createElement("canvas");
      sb.width = sb.height = 128;
      const sg = sb.getContext("2d");
      const grad = sg.createRadialGradient(64, 64, 26, 64, 64, 60);
      grad.addColorStop(0, "#42f5ff06");
      grad.addColorStop(0.82, "#42f5ff30");
      grad.addColorStop(1, "#42f5ff88");
      sg.fillStyle = grad;
      sg.beginPath();
      sg.arc(64, 64, 60, 0, TAU);
      sg.fill();
      sg.strokeStyle = "#9ef9ff";
      sg.globalAlpha = 0.65;
      sg.lineWidth = 2.4;
      sg.stroke();
      this.shieldBubbleSprite = sb;

      // 5. Запечённая виньетка (256×256) вместо CSS-оверлея #game-container::after
      const vig = document.createElement("canvas");
      vig.width = vig.height = 256;
      const vg = vig.getContext("2d");
      const vGrad = vg.createRadialGradient(128, 128, 70, 128, 128, 181);
      vGrad.addColorStop(0, "#03040d00");
      vGrad.addColorStop(1, "#03040d99");
      vg.fillStyle = vGrad;
      vg.fillRect(0, 0, 256, 256);
      this.vignetteSprite = vig;
    }
    sx(x, z) {
      return this.width / 2 + (x - this.camX) * this.focal / z;
    }
    sy(y, z) {
      return this.horizon + (this.camY - y) * this.focal / z;
    }
    render(frame) {
      const { ctx, width: w, height: h } = this;
      const inMenu = frame.state === "menu" || frame.state === "tutorial";
      const lift = inMenu ? 0 : this.cameraLift;
      const speedRatio = frame.reducedMotion ? 0 : smoothstep((frame.speed - 11) / 16);
      const nitroWarp = (!inMenu && !frame.reducedMotion && frame.nitroTimer > 0) ? 0.06 : 0;
      const fovBoost = inMenu ? 1 : (1 + speedRatio * 0.065 + nitroWarp);
      const isGrid = !inMenu && this.level?.mode === "grid3x3";
      this.camX = inMenu ? 0 : frame.player.x * CAM.followX;
      this.camY = isGrid ? (2.85 + frame.player.y * 0.56) : (CAM.height + lift * CAM.roofLift);
      this.focal = (this.baseFocal / fovBoost) / (1 + lift * (frame.reducedMotion ? 0 : CAM.roofZoomOut));
      this.nearVisible = Math.max(CAM.nearZ, this.camY * this.focal / Math.max(1, h - this.horizon));
      this.updateDaySky(frame.dayPhase ?? 0.45, frame.time);
      const pal = this.dayPalette;
      ctx.globalAlpha = 1;
      ctx.drawImage(this.background, 0, 0, w, h);
      if (pal.cloudAlpha > 0.02 && this.skyGeom) {
        const clouds = this.skyGeom.clouds;
        ctx.fillStyle = pal.cloud;
        for (let i = 0; i < clouds.length; i++) {
          const c = clouds[i];
          const x = (((c.baseX + frame.time * c.speed) % 1.36) - 0.18) * w;
          ctx.globalAlpha = pal.cloudAlpha * (i % 2 ? 0.65 : 1);
          ctx.beginPath();
          ctx.ellipse(x, c.y, c.rx, c.ry, 0, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      if (pal.night > 0.35 && !frame.reducedMotion) this.drawShootingStar(frame.time, pal.night);
      ctx.save();
      if (frame.shake > 0) ctx.translate(frame.shake * Math.sin(frame.time * 110) * 4, 0);
      if (!inMenu && !frame.reducedMotion && Math.abs(frame.player.tilt) > 1e-3) {
        ctx.translate(w * 0.5, this.horizon);
        ctx.rotate(-frame.player.tilt * 0.042);
        ctx.translate(-w * 0.5, -this.horizon);
      }
      this.drawGround(frame.distance, pal);
      this.drawRoad(frame.distance, inMenu ? -1 : frame.player.lane, pal);
      this.drawPylons(frame.distance, pal);
      ctx.fillStyle = this.fog;
      ctx.fillRect(0, this.horizon, w, h * 0.2);
      if (inMenu) {
        if (frame.appearancePreview) {
          this.drawAppearancePreview(frame.effects.selected, frame.effectPreview ?? frame.demoTime, frame.effectPreview !== null);
        } else {
          this.drawDemo(frame.demoTime);
        }
      } else {
        if (isGrid) this.drawGridCorridor(frame.distance);
        this.drawScenePass(frame, true);
        if (this.level.goal) this.drawFinish(this.level.goal - frame.distance, frame.time);
        if ((frame.state === "playing" || frame.state === "winning") && !frame.reducedMotion) this.drawRush(frame);
        if (isGrid) this.drawGridReticle(frame.player);
        this.drawTrail(frame);
        this.drawBursts(frame);
        this.drawPlayer(frame);
        this.drawScenePass(frame, false);
        if (frame.state === "winning" && !frame.reducedMotion) this.drawWinFireworks(frame);
        this.drawPopups(frame);
      }
      ctx.restore();
      if (PERF.screenWash) {
        if (pal.twilight > 0.12 && this.warmWash) {
          ctx.globalCompositeOperation = "screen";
          ctx.fillStyle = this.warmWash;
          ctx.fillRect(0, 0, w, h);
          ctx.globalCompositeOperation = "source-over";
        } else if (pal.brightness > 0.7) {
          const dayGlow = (pal.brightness - 0.7) / 0.3;
          ctx.globalCompositeOperation = "screen";

          ctx.globalAlpha = dayGlow * 0.035;
          ctx.fillRect(0, 0, w, h);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";
        }
      }
      if (PERF.blur && this.vignetteSprite) {
        ctx.drawImage(this.vignetteSprite, 0, 0, w, h);
      }
      if (frame.flash > 0) {
        ctx.fillStyle = "#ff224c";
        ctx.globalAlpha = frame.flash * 0.34;
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1;

      if (!inMenu) this.drawHud(frame);

    drawCountdown(timer) {
      const { ctx, width: w, height: h } = this;
      const step = Math.ceil(timer * 2);
      const frac = (timer * 2) % 1 || 1;
      const scale = 0.85 + 0.35 * (1 - frac);
      const size = clamp2(Math.round(Math.min(w, h) * 0.16), 54, 128);
      ctx.save();
      ctx.fillStyle = "#05071666";
      ctx.fillRect(0, 0, w, h);
      ctx.translate(w / 2, h * 0.46);
      ctx.scale(scale, scale);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `italic 900 ${size}px "Segoe UI", system-ui, sans-serif`;
      ctx.globalAlpha = Math.min(1, frac * 3.2);
      ctx.shadowColor = this.skin ? this.skin.light : "#78f5ff";
      ctx.shadowBlur = 24;
      ctx.fillStyle = "#effbff";
      ctx.fillText(String(step), 0, 0);
      ctx.restore();

    drawShootingStar(time, night) {
      const cycle = time % 6.2;
      if (cycle > 0.65) return;
      const { ctx, width: w, height: h } = this;
      const t = cycle / 0.65;
      const seed = Math.floor(time / 6.2);
      const sx = w * (0.18 + (seed * 37 % 64) / 100);
      const sy = this.horizon * (0.12 + (seed * 19 % 34) / 100);
      const dx = w * 0.14;
      const dy = this.horizon * 0.22;
      const x1 = sx + dx * t;
      const y1 = sy + dy * t;
      const x0 = sx + dx * Math.max(0, t - 0.32);
      const y0 = sy + dy * Math.max(0, t - 0.32);
      const grad = ctx.createLinearGradient(x0, y0, x1, y1);
      grad.addColorStop(0, "#ffffff00");
      grad.addColorStop(1, "#e8f8ff");
      ctx.save();
      ctx.globalAlpha = Math.sin(t * Math.PI) * night * 0.85;
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
      ctx.restore();

    drawGround(distance, pal) {
      const { ctx, width: w, height: h } = this;
      ctx.strokeStyle = pal ? hexAlpha(pal.grid, 0.24 + pal.night * 0.14) : "#6557a24d";
      ctx.lineWidth = 1;
      ctx.beginPath();
      const farY = this.sy(0, CAM.farZ);
      for (let i = 1; i <= TRACK.sideGridLines; i++) {
        const x = HALF_TRACK + i * TRACK.sideGridStep;
        for (const side of SIDES) {
          ctx.moveTo(this.sx(side * x, CAM.farZ), farY);
          ctx.lineTo(this.sx(side * x, this.nearVisible), h);
        }
      }
      for (let z = TRACK.segmentLength - distance % TRACK.segmentLength; z < CAM.farZ; z += TRACK.segmentLength) {
        if (z < this.nearVisible) continue;
        const y = this.sy(0, z);
        const roadL = this.sx(-HALF_TRACK, z);
        const roadR = this.sx(HALF_TRACK, z);
        if (roadL > 0) { ctx.moveTo(0, y); ctx.lineTo(roadL, y); }
        if (roadR < w) { ctx.moveTo(roadR, y); ctx.lineTo(w, y); }
      }
      ctx.stroke();
    }
    drawRoad(distance, activeLane = -1, pal = null) {
      const { ctx, nearVisible } = this;
      const length = TRACK.segmentLength;
      const base = Math.floor(distance / length);
      const offset = distance - base * length;
      ctx.fillStyle = this.roadPaint;
      ctx.beginPath();
      this.quad(-HALF_TRACK, HALF_TRACK, nearVisible, CAM.farZ);
      ctx.fill();

      // Солнечная / лунная дорожка отражения на трассе (кэшированный градиент)
      if (pal && this.roadSheen) {
        const shiftX = ((pal.celestialX ?? 0.5) - 0.5) * HALF_TRACK * 1.1;
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = this.roadSheen;
        ctx.beginPath();
        this.quad(shiftX - HALF_TRACK * 0.48, shiftX + HALF_TRACK * 0.48, nearVisible, CAM.farZ);
        ctx.fill();
        ctx.globalCompositeOperation = "source-over";
      }
      ctx.fillStyle = pal ? hexAlpha("#b8d4ff", 0.08 + pal.brightness * 0.09) : "#85a8e41e";
      ctx.beginPath();
      for (let i = 0, z = -offset; z < CAM.farZ; i++, z += length) {
        if (z + length <= nearVisible || (base + i & 1)) continue;
        this.quad(-HALF_TRACK, HALF_TRACK, Math.max(z, nearVisible), Math.min(z + length, CAM.farZ));
      }
      ctx.fill();
      ctx.fillStyle = this.edgeGlow;
      ctx.beginPath();
      this.quad(-HALF_TRACK - 0.65, -HALF_TRACK + 0.4, nearVisible, CAM.farZ);
      this.quad(HALF_TRACK - 0.4, HALF_TRACK + 0.65, nearVisible, CAM.farZ);
      ctx.fill();
      ctx.fillStyle = "#c8dafe27";
      ctx.beginPath();
      for (let z = -offset; z < CAM.farZ; z += length) {
        if (z < nearVisible) continue;
        this.quad(-HALF_TRACK + 0.14, HALF_TRACK - 0.14, z, z + 0.04);
      }
      ctx.fill();
      ctx.fillStyle = COL.laneLine;
      ctx.beginPath();
      for (let i = 0, z = -offset; z < CAM.farZ; i++, z += length) {
        if (z + length <= nearVisible || (base + i & 1)) continue;
        for (let lane = 1; lane < TRACK.laneCount; lane++) {
          const x = -HALF_TRACK + lane * TRACK.laneWidth;
          this.quad(x - 0.036, x + 0.036, Math.max(z, nearVisible), Math.min(z + length, CAM.farZ));
        }
      }
      ctx.fill();
      for (let ei = 0; ei < ROAD_EDGE_SPECS.length; ei++) {
        const spec = ROAD_EDGE_SPECS[ei];
        const halfWidth = spec[0];
        ctx.globalAlpha = spec[1];
        ctx.fillStyle = spec[2] ? this.level.edge : "#fff4fc";
        ctx.beginPath();
        this.quad(-HALF_TRACK - halfWidth, -HALF_TRACK + halfWidth, nearVisible, CAM.farZ);
        this.quad(HALF_TRACK - halfWidth, HALF_TRACK + halfWidth, nearVisible, CAM.farZ);

      }
      ctx.globalAlpha = 1;
    }
    quad(x0, x1, z0, z1) {
      const ctx = this.ctx;
      const y0 = this.sy(0, z0);
      const y1 = this.sy(0, z1);
      ctx.moveTo(this.sx(x0, z0), y0);
      ctx.lineTo(this.sx(x1, z0), y0);
      ctx.lineTo(this.sx(x1, z1), y1);
      ctx.lineTo(this.sx(x0, z1), y1);
      ctx.closePath();
    }
    drawPylons(distance, pal = null) {
      const { ctx, _pylonBuf: buf } = this;
      buf.length = 0;
      const neonBoost = pal ? (0.85 + pal.night * 0.45) : 1;
      for (let z = TRACK.pylonSpacing - distance % TRACK.pylonSpacing; z < CAM.farZ; z += TRACK.pylonSpacing) {
        if (z < CAM.nearZ) continue;
        const scale = this.focal / z;
        const top = this.sy(TRACK.pylonHeight, z);
        const bottom = this.sy(0, z);
        const width = Math.max(1, scale * 0.1);
        const alpha = 1 - z / CAM.farZ;
        for (let s = 0; s < 2; s++) {
          const x = this.sx(SIDES[s] * (HALF_TRACK + TRACK.pylonOffset), z);
          if (x + width * 2 < 0 || x - width * 2 > this.width) continue;
          buf.push(x, top, bottom - top, width, alpha);
        }
      }
      if (!buf.length) return;
      ctx.fillStyle = COL.pylon;
      for (let i = 0; i < buf.length; i += 5) {
        const x = buf[i], top = buf[i + 1], bh = buf[i + 2], w = buf[i + 3], a = buf[i + 4];
        ctx.globalAlpha = Math.min(1, a * 0.24 * neonBoost);
        ctx.fillRect(x - w * 1.1, top, w * 2.2, bh);
        ctx.globalAlpha = a;
        ctx.fillRect(x - w * 0.3, top, w * 0.6, bh);
      }
      ctx.fillStyle = this.level.edge;
      for (let i = 0; i < buf.length; i += 5) {
        const x = buf[i], top = buf[i + 1], w = buf[i + 3], a = buf[i + 4];
        ctx.globalAlpha = a;
        ctx.fillRect(x - w, top, w * 2, w * 0.6);
      }
      ctx.globalAlpha = 1;
    }
    drawSingleItem(item, z, frame) {
      const { ctx } = this;
      const farFade = clamp2((CAM.farZ - z) / (CAM.farZ * 0.35), 0, 1);
      const nearFade = clamp2((z - CAM.nearZ) / 1.35, 0, 1);
      const alpha = farFade * nearFade;
      if (alpha <= 0.01) return;
      if (item.type === "coin") {
        const radius = this.focal / z * 0.56;
        const xRadius = Math.max(1, radius * (0.24 + 0.76 * Math.abs(Math.cos(frame.time * 3 + item.d))));
        ctx.globalAlpha = alpha;
        const x = this.sx(item.x, z);
        const y = this.sy((item.y0 + item.y1) * 0.5, z);
        ctx.drawImage(this.coin, x - xRadius, y - radius, xRadius * 2, radius * 2);
      } else if (isPowerup(item)) {
        this.drawPowerup(item, z, alpha, frame.time);
      } else {
        this.drawObstacle(item, z, alpha);
      }
