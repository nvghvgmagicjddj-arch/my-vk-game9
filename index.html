    }
    drawPlatformSlice(platforms, sliceFront, sliceBack) {
      if (sliceFront >= sliceBack) return;
      const { ctx } = this;
      for (let i = 0; i < platforms.length; i++) {
        const p = platforms[i];
        const front = Math.max(p.front, sliceFront);
        const back = Math.min(p.end, sliceBack);
        if (front >= back) continue;
        ctx.globalAlpha = clamp2((CAM.farZ - Math.max(CAM.nearZ, p.start)) / 16, 0, 1);
        const rampEnd = p.start + p.item.ramp;
        if (back > rampEnd) this.drawDeck(p.item, Math.max(front, rampEnd), back, p.start);
        if (front < rampEnd) this.drawRamp(p.item, front, Math.min(back, rampEnd), p.start);
      }
      ctx.globalAlpha = 1;
    }
    drawGridCorridor(distance) {
      const { ctx } = this;
      const topY = GRID3X3.topY + 0.1;
      const spacing = 14;
      const left = -HALF_TRACK;
      const right = HALF_TRACK;
      ctx.save();
      // Продольные неоновые направляющие уровней высоты 3×3
      ctx.lineWidth = 1;
      for (let i = 1; i <= 3; i++) {
        const y = i === 3 ? topY : GRID3X3.cellBottoms[i] - 0.08;
        ctx.strokeStyle = i === 3 ? this.level.edge : COL.laneLine;
        ctx.globalAlpha = i === 3 ? 0.26 : 0.14;
        ctx.beginPath();
        for (const side of SIDES) {
          ctx.moveTo(this.sx(side * HALF_TRACK, this.nearVisible), this.sy(y, this.nearVisible));
          ctx.lineTo(this.sx(side * HALF_TRACK, CAM.farZ), this.sy(y, CAM.farZ));
        }
        ctx.stroke();
      }
      // Бегущие неоновые рамки-арки коридора 3×3 с плавным затуханием вблизи камеры
      for (let z = spacing - distance % spacing; z < CAM.farZ; z += spacing) {
        if (z < CAM.nearZ + 0.6) continue;
        const nearFade = clamp2((z - CAM.nearZ) / 4.5, 0, 1);
        const farFade = clamp2(1 - z / CAM.farZ, 0, 1);
        const alpha = nearFade * farFade * 0.3;
        if (alpha <= 0.01) continue;
        const l = this.sx(left, z);
        const r = this.sx(right, z);
        const b = this.sy(0, z);
        const t = this.sy(topY, z);
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = this.level.edge;
        ctx.lineWidth = Math.max(1, this.focal / z * 0.028);
        ctx.strokeRect(l, t, r - l, b - t);
      }
      ctx.restore();
    }
    drawGridReticle(player) {
      const { ctx, skin } = this;
      const z = CAM.playerZ;
      const cx = laneToX(player.lane);
      const y0 = GRID3X3.cellBottoms[player.altLane] + 0.08;
      const y1 = y0 + GRID3X3.cellHeight - 0.16;
      const halfW = TRACK.laneWidth * 0.42;
      const l = this.sx(cx - halfW, z);
      const r = this.sx(cx + halfW, z);
      const t = this.sy(y1, z);
      const b = this.sy(y0, z);
      const corner = Math.min(r - l, b - t) * 0.22;
      ctx.save();
      ctx.strokeStyle = skin ? skin.light : COL.laneLine;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = Math.max(1.5, this.focal / z * 0.032);
      ctx.lineCap = "round";
      ctx.beginPath();
      // Аккуратные угловые скобки вместо сплошной рамки поверх глайдера
      ctx.moveTo(l, t + corner); ctx.lineTo(l, t); ctx.lineTo(l + corner, t);
      ctx.moveTo(r - corner, t); ctx.lineTo(r, t); ctx.lineTo(r, t + corner);
      ctx.moveTo(r, b - corner); ctx.lineTo(r, b); ctx.lineTo(r - corner, b);
      ctx.moveTo(l + corner, b); ctx.lineTo(l, b); ctx.lineTo(l, b - corner);
      ctx.stroke();
      ctx.restore();
    }
    drawGridBlockBatch(singles, startIdx, endIdx, z) {
      const { ctx } = this;
      const farFade = clamp2((CAM.farZ - z) / (CAM.farZ * 0.35), 0, 1);
      const nearFade = clamp2((z - CAM.nearZ) / 1.35, 0, 1);
      const alpha = farFade * nearFade;
      if (alpha <= 0.01) return;
      const halfDepth = CONFIG.obstacles.depth * 0.5;
      const front = Math.max(z - halfDepth, CAM.nearZ);
      const back = z + halfDepth;
      const hasDepth = back > front + 1e-3;
      const lw = Math.max(1.4, 0.041 * this.focal / front);
      const topHiH = Math.max(1, lw * 0.5);
      const blockCol = COL.block;

      // 1. Наземные тени для нижнего ряда
      ctx.fillStyle = blockCol;
      ctx.globalAlpha = alpha * 0.22;
      ctx.beginPath();
      let hasGround = false;
      for (let i = startIdx; i < endIdx; i++) {
        const item = singles[i].item;
        if (item.y0 <= 0.05) {
          const left = item.x - item.w * 0.5, right = item.x + item.w * 0.5;
          this.quad(left - 0.06, right + 0.06, Math.max(this.nearVisible, front - 0.55), back + 0.2);
          hasGround = true;
        }
      }
      if (hasGround) ctx.fill();

      // 2. Боковые 3D-грани
      if (hasDepth) {
        ctx.globalAlpha = alpha * 0.34;
        ctx.beginPath();
        for (let i = startIdx; i < endIdx; i++) {
          const item = singles[i].item;
          const left = item.x - item.w * 0.5, right = item.x + item.w * 0.5;
          const top = this.sy(item.y1, front), bottom = this.sy(item.y0, front);
          const rearTop = this.sy(item.y1, back), rearBottom = this.sy(item.y0, back);
          if (left > this.camX) {
            const l = this.sx(left, front), rl = this.sx(left, back);
            ctx.moveTo(l, top); ctx.lineTo(rl, rearTop); ctx.lineTo(rl, rearBottom); ctx.lineTo(l, bottom); ctx.closePath();
          } else if (right < this.camX) {
            const r = this.sx(right, front), rr = this.sx(right, back);
            ctx.moveTo(r, top); ctx.lineTo(rr, rearTop); ctx.lineTo(rr, rearBottom); ctx.lineTo(r, bottom); ctx.closePath();
          }
        }
        ctx.fill();

        // 3. Верхние/нижние 3D-грани
        ctx.globalAlpha = alpha * 0.46;
        ctx.beginPath();
        for (let i = startIdx; i < endIdx; i++) {
          const item = singles[i].item;
          const left = item.x - item.w * 0.5, right = item.x + item.w * 0.5;
          const l = this.sx(left, front), r = this.sx(right, front);
          const rl = this.sx(left, back), rr = this.sx(right, back);
          if (item.y1 < this.camY) {
            const top = this.sy(item.y1, front), rt = this.sy(item.y1, back);
            ctx.moveTo(l, top); ctx.lineTo(r, top); ctx.lineTo(rr, rt); ctx.lineTo(rl, rt); ctx.closePath();
          } else if (item.y0 > this.camY) {
            const bottom = this.sy(item.y0, front), rb = this.sy(item.y0, back);
            ctx.moveTo(l, bottom); ctx.lineTo(r, bottom); ctx.lineTo(rr, rb); ctx.lineTo(rl, rb); ctx.closePath();
          }
        }
        ctx.fill();
      }

      // 4. Полупрозрачная заливка передних граней + неоновые рамки + белая кромка + тёмный центр
      ctx.globalAlpha = alpha * 0.24;
      ctx.beginPath();
      for (let i = startIdx; i < endIdx; i++) {
        const item = singles[i].item;
        const l = this.sx(item.x - item.w * 0.5, front), r = this.sx(item.x + item.w * 0.5, front);
        const top = this.sy(item.y1, front), bottom = this.sy(item.y0, front);
        ctx.rect(l, top, r - l, bottom - top);
      }
      ctx.fill();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = blockCol;
      ctx.lineWidth = lw;
      ctx.stroke();

      ctx.globalAlpha = alpha * 0.52;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      for (let i = startIdx; i < endIdx; i++) {
        const item = singles[i].item;
        const l = this.sx(item.x - item.w * 0.5, front), r = this.sx(item.x + item.w * 0.5, front);
        ctx.rect(l, this.sy(item.y1, front), r - l, topHiH);
      }
      ctx.fill();

      ctx.globalAlpha = alpha * 0.83;
      ctx.fillStyle = "#17142e";
      ctx.beginPath();
      for (let i = startIdx; i < endIdx; i++) {
        const item = singles[i].item;
        const l = this.sx(item.x - item.w * 0.5, front), r = this.sx(item.x + item.w * 0.5, front);
        const top = this.sy(item.y1, front), bottom = this.sy(item.y0, front);
        const bw = r - l, bh = bottom - top;
        if (bw >= 8 && bh >= 5) ctx.rect(l + bw * 0.05, top + bh * 0.11, bw * 0.9, bh * 0.78);
      }
      ctx.fill();

      // 5. Знаки «СТОП»
      ctx.globalAlpha = alpha;
      for (let i = startIdx; i < endIdx; i++) {
        const item = singles[i].item;
        const l = this.sx(item.x - item.w * 0.5, front), r = this.sx(item.x + item.w * 0.5, front);
        const top = this.sy(item.y1, front), bottom = this.sy(item.y0, front);
        const bw = r - l, bh = bottom - top;
        if (bw < 8 || bh < 5) continue;
        const s = Math.min(bw, bh) * 0.38 * 2.56;
        ctx.drawImage(this.stopSprite, (l + r - s) * 0.5, (top + bottom - s) * 0.5, s, s);
      }
      ctx.globalAlpha = 1;
    }
    drawScenePass(frame, far) {
      const offset = CAM.playerZ - frame.distance;
      const items = frame.world.items;
      const nearZ = far ? CAM.playerZ : CAM.nearZ;
      const farZ = far ? CAM.farZ : CAM.playerZ;
      const platforms = this._platforms;
      const singles = this._singles;
      const pPool = this._platformPool;
      const sPool = this._singlePool;
      let pCount = 0, sCount = 0;
      platforms.length = 0;
      singles.length = 0;
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        if (isPlatform(item)) {
          const start = offset + item.d;
          const end = Math.min(offset + item.end, farZ);
          const front = Math.max(start, nearZ);
          if (front < end) {
            let rec = pPool[pCount];
            if (!rec) { rec = { item: null, start: 0, front: 0, end: 0 }; pPool[pCount] = rec; }
            rec.item = item; rec.start = start; rec.front = front; rec.end = end;
            platforms[pCount++] = rec;
          }
        } else {
          const z = offset + item.d;
          if (z > CAM.nearZ && z < CAM.farZ && far === (z >= CAM.playerZ)) {
            const dx = item.x - this.camX;
            const dy = (item.y0 + item.y1) * 0.5 - this.camY;
            let rec = sPool[sCount];
            if (!rec) { rec = { item: null, z: 0, distSq: 0, isPickup: 0 }; sPool[sCount] = rec; }
            rec.item = item; rec.z = z; rec.distSq = dx * dx + dy * dy;
            rec.isPickup = item.type === "coin" || isPowerup(item) ? 1 : 0;
            singles[sCount++] = rec;
          }
        }
      }
      // Строгая 3D-сортировка от дальних к ближним (по Z, затем по удалённости от камеры в плоскости X-Y)
      singles.sort(SORT_SINGLES);
      // Внешние полосы рисуются раньше центральной, чтобы ближняя центральная платформа перекрывала боковую
      if (pCount > 1) platforms.sort(this._sortPlatforms);
      if (pCount === 0) {
        const isGrid = this.level?.mode === "grid3x3";
        for (let i = 0; i < sCount; i++) {
          const rec = singles[i];
          if (isGrid && rec.item.type === "block") {
            let j = i + 1;
            while (j < sCount && singles[j].item.type === "block" && Math.abs(singles[j].z - rec.z) <= 0.05) j++;
            if (j - i > 1) {
              this.drawGridBlockBatch(singles, i, j, rec.z);
              i = j - 1;
              continue;
            }
          }
          this.drawSingleItem(rec.item, rec.z, frame);
        }
        return;
      }
      let cursorZ = farZ;
      for (let i = 0; i < sCount; i++) {
        const { item, z } = singles[i];
        // Разрезаем платформы по Z, чтобы дальние препятствия за поездом не рисовались поверх него
        if (z < cursorZ) {
          this.drawPlatformSlice(platforms, z, cursorZ);
          cursorZ = z;
        }
        this.drawSingleItem(item, z, frame);
      }
      if (cursorZ > nearZ) this.drawPlatformSlice(platforms, nearZ, cursorZ);
    }
    deckQuad(left, right, front, back, nearHeight, farHeight) {
      const top = this.sy(nearHeight, front);

      point.tilt = player.tilt;
      point.y = Math.max(0.12, player.y + 0.43 - player.slideBlend * 0.16);
      point.distance = distance;
      point.time = time;

  var VKIntegration = class {
    constructor(container) {
      this.container = container;

    async init(onCloudData, hooks = {}) {
      let bridge = window.vkBridge;
      if (!bridge || typeof bridge.send !== "function") {
        await new Promise((resolve) => {
          if (document.readyState === "complete") resolve();
          else window.addEventListener("load", resolve, { once: true });
        });

      }
      if (!bridge || typeof bridge.send !== "function") return;

      try {
        if (typeof bridge.subscribe === "function") {
          bridge.subscribe((event) => {

              this.applyInsets(data.insets);
              hooks.onInsets?.();
            } else if (type === "VKWebAppViewHide") {
              hooks.onHide?.();
            } else if (type === "VKWebAppViewRestore") {
              hooks.onRestore?.();
            }
          });
        }
        await withTimeout(bridge.send("VKWebAppInit"), 8000);
        this.ready = true;
        this.refreshAds();
        const cloud = await this.loadCloud();
        if (cloud && onCloudData) onCloudData(cloud);
      } catch {
        this.ready = false;
      }
    }
    async checkAd(adFormat) {
      if (!this.ready || !this.bridge) return false;
      try {
        const res = await withTimeout(this.bridge.send("VKWebAppCheckNativeAds", { ad_format: adFormat }), 8000);
        const ok = Boolean(res?.result);
        if (adFormat === "reward") this.rewardReady = ok;
        else if (adFormat === "interstitial") this.interstitialReady = ok;
        return ok;
      } catch {
        if (adFormat === "reward") this.rewardReady = false;
        else if (adFormat === "interstitial") this.interstitialReady = false;
        return false;
      }
    }
    refreshAds() {
      if (!this.ready) return;
      this.checkAd("reward");
      this.checkAd("interstitial");
    }
    applyInsets(insets) {
      if (!this.container || !insets) return;
      const set = (name, val) => {
        if (Number.isFinite(val)) this.container.style.setProperty(name, `${Math.max(0, val)}px`);
      };
      set("--vk-inset-top", insets.top);
      set("--vk-inset-right", insets.right);
      set("--vk-inset-bottom", insets.bottom);
      set("--vk-inset-left", insets.left);
    }
    async loadCloud() {
      if (!this.ready || !this.bridge) return null;
      try {
        const res = await withTimeout(this.bridge.send("VKWebAppStorageGet", { keys: [this.cloudKey] }), 8000);

        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }
    saveCloud(payload) {
      if (!this.ready || !this.bridge) return;

    }
    flushCloud() {
      clearTimeout(this.saveTimer);

      if (!payload || !this.ready || !this.bridge) return;
      this.pendingPayload = null;
      try {
        this.bridge.send("VKWebAppStorageSet", { key: this.cloudKey, value: JSON.stringify(payload) }).catch(() => {});
      } catch {
      }
    }
    async showInterstitial() {
      if (!this.ready || !this.bridge) return false;
      try {
        const available = this.interstitialReady || await this.checkAd("interstitial");
        if (!available) return false;
        const res = await withTimeout(this.bridge.send("VKWebAppShowNativeAds", { ad_format: "interstitial" }), 120000);
        this.checkAd("interstitial");
        return Boolean(res?.result);
      } catch {
        return false;
      }
    }
    async showRewarded() {
      if (!this.ready || !this.bridge) return false;
      try {
        const available = this.rewardReady || await this.checkAd("reward");
        if (!available) return false;
        const res = await withTimeout(this.bridge.send("VKWebAppShowNativeAds", { ad_format: "reward" }), 120000);
        this.checkAd("reward");
        return Boolean(res?.result);
      } catch {
        return false;
      }
    }
  };

        for (const k of cloud.unlockedEffects) {
          if (!this.unlockedEffects.has(k)) {
            this.unlockedEffects.add(k);
            changed = true;
          }
        }
      }
      if (cloud.records && typeof cloud.records === "object") {
        for (const level of LEVELS.slice(1)) {
          const rec = cloud.records[level.id];
          if (!rec || !Number.isFinite(rec.score)) continue;
          const prev = this.records.get(level.id);
          const mergedScore = Math.max(rec.score, prev?.score ?? 0);
          const mergedCleared = Boolean(rec.cleared || prev?.cleared);
          if (!prev || mergedScore > prev.score || mergedCleared !== Boolean(prev.cleared)) {
            this.records.set(level.id, { score: mergedScore, cleared: mergedCleared });
            changed = true;
          }
        }
      }
      if (changed) {
        this.saveProfile(false);
        this.updateChoices();
        this.refreshEffectOptions();
        this.updateBuyBar();
      }
    }
    isSkinUnlocked(skinId) {
      return this.unlockedSkins.has(skinId);
    }
    isEffectUnlocked(groupId, value) {
      return this.unlockedEffects.has(effectKey(groupId, value));
    }
    addPopup(text, color = "#78f5ff", key = null) {
      if (key) {
        const existing = this.popups.find((p) => p.key === key && this.clock - p.time < 0.9);
        if (existing) {
          existing.text = text;
          existing.color = color;
          existing.x = this.player.x;
          existing.y = this.player.y;
          existing.time = this.clock;
          return;
        }
      }
      let yOffset = 0;
      for (const p of this.popups) {
        if (this.clock - p.time < 0.38 && Math.abs(p.x - this.player.x) < 1.2) {
          yOffset += 0.48;
        }
      }
      if (this.popups.length >= 6) this.popups.shift();
      this.popups.push({ text, color, key, x: this.player.x, y: this.player.y + yOffset, time: this.clock });
    }

      }

    buildEffects() {

        select.value = this.effects.selected[group.id];

          const val = select.value;
          const opt = group.options.find(([v]) => v === val);
          const price = opt ? opt[2] : 0;
          this.previewStart = this.demoTime - previewCue[group.id];

            this.pendingEffectBuy = null;
            this.effects.selected[group.id] = val;

          this.draw();

    refreshEffectOptions() {

    revertPendingPreview() {

      if (this.pendingEffectBuy) {

    updateBuyBar() {

      if (this.screen === "skins" && this.previewSkin && !this.isSkinUnlocked(this.previewSkin.id)) {

      } else if (this.screen === "effects" && this.pendingEffectBuy && !this.isEffectUnlocked(this.pendingEffectBuy.groupId, this.pendingEffectBuy.value)) {
        item = { kind: "effect", name: this.pendingEffectBuy.name, price: this.pendingEffectBuy.price };
      }
      if (!item) {
        this.buyBar.hidden = true;

      this.buyBar.hidden = false;
      this.buyAction.textContent = `Купить «${item.name}» · ${item.price} ●`;

    purchasePending() {

        this.draw();

      }
      if (this.screen === "effects" && this.pendingEffectBuy) {

        }
        this.spend(price);
        this.unlockedEffects.add(effectKey(groupId, value));
        this.effects.selected[groupId] = value;
        this.pendingEffectBuy = null;
        this.sound.playBuy();
        this.saveProfile();
        this.updateChoices();

        this.updateBuyBar();

    saveProfile(syncCloud = true) {

    handleAction(action) {
      if (document.hidden) return;
      if (action === "mute") {
        this.toggleSound();
        return;
      }
      if (action === "music") {
        this.toggleMusic();
        return;
      }
      if (this.state === "menu") {
        if (this.screen === "home" && START_ACTIONS.has(action)) this.start();
        if (this.screen !== "home" && action === "pause") this.backToHome();
        return;
      }
      if (this.state === "over") {
        if (this.reviving) return;
        if (START_ACTIONS.has(action) && this.resultTime >= CONFIG.game.restartDelay) {
          if (this.lastCleared && !this.overlayNext.hidden) this.nextLevel();
          else this.start();
        }
        return;
      }
      if (this.state === "paused") {
        if (START_ACTIONS.has(action) || action === "pause") this.resume();
        return;
      }
      if (this.state === "resuming" || this.state === "winning") {
        if (action === "pause" && this.state === "resuming") this.pause(true);
        return;
      }
      if (this.state === "tutorial") {
        if (action === "pause") this.returnToMenu();
        else if (START_ACTIONS.has(action)) this.start();
        return;
      }
      if (this.state !== "playing") return;
      switch (action) {
        case "left":
          this.player.moveLeft();
          if (this.player.laneChanged) {
            this.sound.playLane(this.player.laneChanged);
            this.player.laneChanged = 0;
          }
          break;
        case "right":
          this.player.moveRight();
          if (this.player.laneChanged) {
            this.sound.playLane(this.player.laneChanged);
            this.player.laneChanged = 0;
          }
          break;
        case "jump":
          if (this.player.gridMode) {
            this.player.moveUp();
            if (this.player.altChanged) {
              this.sound.playLane(1);
              this.player.altChanged = 0;
            }
          } else {
            this.player.jump();
            if (this.player.tricked) {
              this.sound.playTrick();
              this.player.tricked = false;
            }
          }
          break;
        case "slide":
          if (this.player.gridMode) {
            this.player.moveDown();
            if (this.player.altChanged) {
              this.sound.playLane(-1);
              this.player.altChanged = 0;
            }
          } else {
            this.player.slide();
            if (this.player.fastFell) {
              this.sound.playSlide(true);
              this.player.fastFell = false;
            } else if (this.player.slid) {
              this.sound.playSlide(false);
              this.player.slid = false;
            }
          }
          break;
        case "pause":
          this.pause(true);
          break;
      }

      this.input.setGridMode(gridMode);
      this.player.reset(gridMode);
      this.renderer.resetCamera();
      this.effects.reset();
      this.tricks = 0;

      this.magnetTimer = 0;
      this.nitroTimer = 0;
      this.invulnTimer = 0;
      this.state = "playing";
      this.menu.hidden = true;
      this.overlay.hidden = true;
      this.pauseButton.hidden = false;
      this.vibrate(18);
      this.container.focus({ preventScroll: true });
      this.draw();
      this.scheduleFrame();
    }
    async tryRevive() {
      if (this.reviveUsed || this.reviving || this.state !== "over" || !this.reviveMode) return;
      const mode = this.reviveMode;
      this.reviving = true;
      this.overlayRevive.disabled = true;
      this.overlayDouble.disabled = true;
      this.overlayNext.disabled = true;
      this.overlayAction.disabled = true;
      this.overlayMenu.disabled = true;
      let granted = false;
      if (mode === "ad") {
        granted = await this.vk.showRewarded();
      } else if (mode === "coins") {
        const cost = CONFIG.game.reviveCost;
        if (this.wallet >= cost) {
          this.spend(cost);
          this.saveProfile();
          this.updateChoices();
          granted = true;
        }
      }
      this.reviving = false;
      this.overlayMenu.disabled = false;
      if (this.state !== "over") return;
      if (!granted) {
        this.sound.playError();
        if (mode === "ad" && !this.vk.rewardReady) {
          if (this.wallet >= CONFIG.game.reviveCost) {
            this.reviveMode = "coins";
            this.overlayRevive.textContent = `Второй шанс (${CONFIG.game.reviveCost} ●)`;
          } else {
            this.reviveMode = null;
            this.overlayRevive.hidden = true;
          }
        }
        if (this.resultTime >= CONFIG.game.restartDelay) {
          this.overlayAction.disabled = false;
          if (!this.overlayNext.hidden) this.overlayNext.disabled = false;
          if (!this.overlayRevive.hidden) this.overlayRevive.disabled = false;
          if (!this.overlayDouble.hidden && !this.coinsDoubled) this.overlayDouble.disabled = false;
        }
        return;
      }
      this.reviveUsed = true;
      this.reviveMode = null;
      this.sound.playPowerup("shield");
      this.world.clearAhead(this.distance, 32);
      if (this.player.gridMode) {
        this.player.lane = 1;
        this.player.altLane = 1;
        this.player.x = laneToX(1);
        this.player.y = GRID3X3.levelsY[1];
      } else {
        this.player.y = 0;
      }
      this.player.vy = 0;
      this.player.state = PlayerState.RUN;
      this.player.surface = null;
      this.player.surfaceHeight = 0;
      this.player.lastSurfaceHeight = 0;
      this.player.jumping = false;
      this.player.flightRate = 1;
      this.player.trickTime = null;
      this.player.slideTimer = 0;
      this.player.slideOnLanding = false;
      this.player.slideBlend = 0;
      this.player.coyoteTimer = 0;
      this.player.jumpBufferTimer = 0;
      this.player.flipResidual = 0;
      this.player.hoverOffset = 0;
      this.player.hoverVelocity = 0;
      this.renderer.resetCamera();
      this.crashTime = 0;
      this.flash = 0;
      this.shake = 0;
      this.shield = false;
      this.invulnTimer = CONFIG.powerups.reviveGrace;
      this.overlay.hidden = true;
      this.pauseButton.hidden = false;
      this.container.focus({ preventScroll: true });
      this.addPopup("Второй шанс!", "#ffd15b");
      if (this.reducedMotion.matches) {
        this.state = "playing";
      } else {
        this.state = "resuming";
        this.resumeTimer = 1.5;
        this.lastCountdownNum = 4;
      }
      this.draw();
      this.scheduleFrame();
    }
    async tryDoubleCoins() {
      if (this.coinsDoubled || this.reviving || this.state !== "over" || this.world.coins <= 0) return;
      if (!this.vk.ready || !this.vk.rewardReady) return;
      this.reviving = true;
      this.overlayDouble.disabled = true;
      this.overlayRevive.disabled = true;
      this.overlayNext.disabled = true;
      this.overlayAction.disabled = true;
      this.overlayMenu.disabled = true;
      const granted = await this.vk.showRewarded();
      this.reviving = false;
      this.overlayMenu.disabled = false;
      if (this.state !== "over") return;
      if (this.resultTime >= CONFIG.game.restartDelay) {
        this.overlayAction.disabled = false;
        if (!this.overlayNext.hidden) this.overlayNext.disabled = false;
        if (!this.overlayRevive.hidden) this.overlayRevive.disabled = false;
      }
      if (!granted) {
        this.sound.playError();
        if (this.resultTime >= CONFIG.game.restartDelay) this.overlayDouble.disabled = false;
        return;
      }
      this.coinsDoubled = true;
      const bonusCoins = this.world.coins;
      this.runBonusCoins += bonusCoins;
      this.earn(bonusCoins);
      this.saveProfile();
      this.updateChoices();
      this.sound.playBuy();
      this.overlayDouble.hidden = true;
      const totalRunCoins = this.world.coins + this.runBonusCoins;
      this.overlayHint.textContent = this.overlayHint.textContent.replace(
        /Монеты: \+\d+ \(● \d+\)/,
        `Монеты: +${totalRunCoins} (● ${this.wallet})`
      );
    }
    nextLevel() {
      if (this.reviving) return;
      const idx = LEVELS.indexOf(this.level);
      if (idx < 0 || idx + 1 >= LEVELS.length) return;
      this.sound.playUi();
      this.level = LEVELS[idx + 1];
      this.renderer.setLevel(this.level);
      this.saveProfile();
      this.updateChoices();
      this.state = "over";
      this.start();
    }
    returnToMenu() {
      this.state = "menu";
      this.sound.updateEngine(false);
      this.sound.updateMusic(false);
      this.menu.hidden = false;
      this.overlay.hidden = true;
      this.pauseButton.hidden = true;
      this.distance = 0;
      this.demoTime = 0;
      this.flash = 0;
      this.shake = 0;
      this.popups = [];
      this.updateChoices();
      this.showScreen("home", this.play);
      this.scheduleFrame();
    }
    get runDistance() {
      return this.level.goal ? Math.min(this.distance, this.level.goal) : this.distance;
    }
    get score() {
      return (
        Math.floor(this.runDistance) +
        this.world.coins * CONFIG.game.coinScore +
        this.coinBonus +
        this.tricks * CONFIG.game.trickScore +
        this.world.nearMisses * CONFIG.game.nearMissScore
      );
    }
    get best() {
      return this.level.id === "endless" ? this.endlessBest : (this.records.get(this.level.id)?.score ?? 0);
    }
    beginWin() {
      this.state = "winning";
      this.winTime = 0;
      this.pauseButton.hidden = true;
      this.sound.playWin();
      this.vibrate([22, 30, 28, 30, 50]);
      this.addPopup("Финиш!", "#78f5ff");
      if (this.reducedMotion.matches) this.finish(true);
    }
    finish(cleared) {
      if (cleared && this.state !== "winning") {
        this.sound.playWin();
        this.vibrate([22, 30, 28, 30, 50]);
      }
      this.sound.updateEngine(false);
      this.sound.updateMusic(false);
      const earnedCoins = Math.max(0, this.world.coins - this.bankedRunCoins);
      if (earnedCoins > 0) {
        this.earn(earnedCoins);
        this.bankedRunCoins = this.world.coins;
      }
      const score = this.score;
      const record = score > this.best;
      if (record && !this.recordBeaten) {
        this.recordBeaten = true;
        if (!cleared) this.vibrate([18, 30, 32]);
      }
      if (this.level.id !== "endless") {
        const previous = this.records.get(this.level.id);
        if (record || (cleared && !previous?.cleared)) {
          this.records.set(this.level.id, { score: Math.max(score, this.best), cleared: cleared || !!previous?.cleared });
        }
      } else if (record) {
        this.endlessBest = score;
        write(CONFIG.game.storageKey, score);
      }
      this.saveProfile();
      this.lastCleared = cleared;
      this.state = "over";
      this.resultTime = 0;
      this.flash = 0;
      this.shake = 0;
      let shouldShowInterstitial = false;
      if (!cleared) {
        this.crashCount++;
        shouldShowInterstitial = this.vk.ready && this.crashCount % 3 === 0;
      }
      const totalRunCoins = this.world.coins + this.runBonusCoins;
      const stats1 = [`Очки: ${score}`, `Монеты: +${totalRunCoins} (● ${this.wallet})`];
      if (this.level.goal) stats1.push(`${Math.floor(this.runDistance)} / ${this.level.goal} м`);
      const stats2 = [];
      if (this.tricks) stats2.push(`Кувырки: ${this.tricks}`);
      if (this.world.nearMisses) stats2.push(`Впритирку: ${this.world.nearMisses}`);
      if (this.maxCoinStreak >= 3) stats2.push(`Серия: ×${this.maxCoinStreak}`);
      const lines = [stats1.join(" · ")];
      if (stats2.length) lines.push(stats2.join(" · "));
      lines.push(record ? "Новый рекорд!" : `Рекорд: ${this.best}`);
      const nextLv = LEVELS[LEVELS.indexOf(this.level) + 1];
      const hasNext = cleared && this.level.goal && Boolean(nextLv && nextLv.goal);
      const adRevive = this.vk.ready && this.vk.rewardReady;
      const coinRevive = this.wallet >= CONFIG.game.reviveCost;
      this.reviveMode = !cleared && !this.reviveUsed
        ? (adRevive ? "ad" : coinRevive ? "coins" : null)
        : null;
      const reviveLabel = this.reviveMode === "ad"
        ? "Второй шанс (Реклама)"
        : this.reviveMode === "coins"
          ? `Второй шанс (${CONFIG.game.reviveCost} ●)`
          : "";
      const doubleLabel = this.vk.ready && this.vk.rewardReady && !this.coinsDoubled && this.world.coins > 0
        ? `×2 монеты (+${this.world.coins} ● за рекламу)`
        : "";
      this.showOverlay(
        cleared ? "Уровень пройден" : "Крушение",
        lines.join("\n"),
        "Играть снова",
        hasNext,
        reviveLabel,
        doubleLabel
      );
      this.overlayAction.disabled = true;
      this.overlayNext.disabled = true;
      this.overlayRevive.disabled = true;
      this.overlayDouble.disabled = true;
      if (shouldShowInterstitial) {
        this.showEndInterstitial();
      } else {
        this.overlayMenu.focus({ preventScroll: true });
        this.vk.refreshAds();
      }
      this.scheduleFrame();
    }
    async showEndInterstitial() {
      if (this.reviving) return;
      this.reviving = true;
      this.overlayMenu.disabled = true;
      try {
        await this.vk.showInterstitial();
      } finally {
        this.reviving = false;
        this.overlayMenu.disabled = false;
        if (this.state === "over") {
          this.vk.refreshAds();
          if (this.resultTime >= CONFIG.game.restartDelay) {
            this.unlockOverActions();
          } else {
            this.overlayMenu.focus({ preventScroll: true });
          }
        }
      }
    }
    unlockOverActions() {
      this.overlayAction.disabled = false;
      if (!this.overlayNext.hidden) this.overlayNext.disabled = false;
      if (!this.overlayRevive.hidden) this.overlayRevive.disabled = false;
      if (!this.overlayDouble.hidden && !this.coinsDoubled) this.overlayDouble.disabled = false;
      const focusTarget = !this.overlayNext.hidden
        ? this.overlayNext
        : !this.overlayRevive.hidden
          ? this.overlayRevive
          : this.overlayAction;
      focusTarget.focus({ preventScroll: true });
    }
    beginCrash() {
      this.state = "crashing";
      this.crashTime = 0;
      this.pauseButton.hidden = true;
      this.sound.playCrash();
      this.vibrate([35, 25, 60]);
      this.flash = this.reducedMotion.matches ? 0 : 0.08;
      this.shake = this.reducedMotion.matches ? 0 : 0.4;
    }
    pause(focus = false) {
      if (this.state !== "playing" && this.state !== "resuming") return;
      this.state = "paused";
      this.sound.updateEngine(false);
      this.sound.updateMusic(false);
      this.cancelFrame();
      const hint = this.touchControls.matches ? "Нажмите кнопку, чтобы продолжить заезд" : "Пробел или кнопка продолжат заезд";
      this.showOverlay("Пауза", hint, "Продолжить");
      if (focus) this.overlayAction.focus({ preventScroll: true });
    }
    resume() {
      if (document.hidden) return;
      this.sound.init();
      this.overlay.hidden = true;
      this.pauseButton.hidden = false;
      this.container.focus({ preventScroll: true });
      if (this.reducedMotion.matches) {
        this.state = "playing";
      } else {
        this.state = "resuming";
        this.resumeTimer = 1.5;
        this.lastCountdownNum = 4;
      }
      this.draw();
      this.scheduleFrame();
    }
    showOverlay(title, hint, label, showNext = false, reviveLabel = "", doubleLabel = "") {
      this.pauseButton.hidden = true;
      this.overlayTitle.textContent = title;
      this.overlayHint.textContent = hint;
      this.overlayAction.textContent = label;
      this.overlayAction.disabled = false;
      this.overlayMenu.disabled = false;
      this.overlayNext.hidden = !showNext;
      this.overlayNext.disabled = false;
      this.overlayRevive.hidden = !reviveLabel;
      this.overlayRevive.disabled = false;
      if (reviveLabel) this.overlayRevive.textContent = reviveLabel;
      this.overlayDouble.hidden = !doubleLabel;
      this.overlayDouble.disabled = false;
      if (doubleLabel) this.overlayDouble.textContent = doubleLabel;
      this.overlayAction.classList.toggle("button--primary", !showNext);
      this.overlay.hidden = false;
    }
    scheduleFrame() {
      if (this.frame !== null || document.hidden || this.state === "paused" || this.state === "tutorial") return;
      if (this.state === "menu" && this.reducedMotion.matches) return;
      if (this.state === "over" && this.resultTime >= CONFIG.game.restartDelay) return;
      this.frame = requestAnimationFrame(this.loop);
    }
    cancelFrame() {
      if (this.frame !== null) cancelAnimationFrame(this.frame);
      this.frame = null;
      this.lastTimestamp = null;
      this.lastRaf = null;
    }
    loop(timestamp) {
      this.frame = null;
      this.input.pollGamepad();
      PerfGov.tick(timestamp - (this.lastRaf ?? timestamp));
      this.lastRaf = timestamp;
      // Кап частоты: пропущенный кадр ничего не стоит, а dt копится до следующего отрисованного
      if (PERF.minStep && this.lastTimestamp !== null && timestamp - this.lastTimestamp < PERF.minStep - 1.5) {
        this.scheduleFrame();
        return;
      }
      const dt = Math.max(0, Math.min((timestamp - (this.lastTimestamp ?? timestamp)) / 1e3, CONFIG.loop.maxDt));
      this.lastTimestamp = timestamp;
      this.update(dt);
      this.draw();
      this.scheduleFrame();
      if (this.frame === null) this.lastTimestamp = null;
    }
    update(dt) {
      if (this.state === "playing") {
        const steps = Math.max(1, Math.ceil(dt * 60 - 1e-9));
        for (let i = 0; i < steps && this.state === "playing"; i++) this.updateRun(dt / steps);
        const active = this.state === "playing";
        this.sound.updateEngine(
          active,
          this.speed,
          this.player.isAirborne,
          this.player.state === PlayerState.SLIDE
        );
        this.sound.updateMusic(active, this.speed, this.level.music);
        return;
      }
      if (this.state === "resuming") {
        this.resumeTimer -= dt;
        const num = Math.ceil(this.resumeTimer * 2);
        if (num > 0 && num < this.lastCountdownNum) {
          this.lastCountdownNum = num;
          this.sound.playCountdown(false);
        }
        if (this.resumeTimer <= 0) {
          this.resumeTimer = 0;
          this.state = "playing";
          this.sound.playCountdown(true);
        }
        return;
      }
      this.clock += dt;
      if (this.state === "menu") {
        this.demoTime += dt;
        this.distance += CONFIG.speed.idle * dt;
        if (this.level.id === "endless") this.dayPhase = (this.dayPhase + dt / CONFIG.dayCycle.menuDuration) % 1;
        else this.dayPhase = this.level.startPhase ?? 0.5;
        return;
      }
      if (this.state === "winning") {
        this.winTime += dt;
        const slowFactor = Math.max(0.28, 1 - this.winTime / CONFIG.game.winDuration * 0.72);
        this.distance += this.speed * slowFactor * dt;
        this.effects.expire(this.clock);
        this.effects.sample(this.player, this.distance, this.clock);
        while (this.popups.length && this.clock - this.popups[0].time > 0.95) this.popups.shift();
        if (this.winTime >= CONFIG.game.winDuration) this.finish(true);
        return;
      }
      if (this.state === "crashing") {
        this.crashTime += dt;
        this.effects.expire(this.clock);
        this.flash = Math.max(0, this.flash - dt * 0.35);
        this.shake = Math.max(0, this.shake - dt * 1.4);
        if (this.crashTime >= CONFIG.game.crashDuration) this.finish(false);
        return;
      }
      if (this.state === "over") {
        this.resultTime += dt;
        if (this.resultTime >= CONFIG.game.restartDelay && !this.reviving && this.overlayAction.disabled) {
          this.unlockOverActions();
        }
      }
    }
    updateRun(dt) {
      this.clock += dt;
      this.runTime += dt;
      if (this.level.id === "endless") {
        // В бесконечном режиме: старт днём (0.25) -> первый закат (0.50) ровно на 7 000 очков, полный цикл = 28 000 очков
        const fullCycleScore = CONFIG.dayCycle.firstSunsetScore * 4;
        const targetPhase = (this.level.startPhase ?? 0.25) + this.score / fullCycleScore;
        this.dayPhase += (targetPhase - this.dayPhase) * (1 - Math.exp(-3.5 * dt));
      }
      if (this.magnetTimer > 0) this.magnetTimer = Math.max(0, this.magnetTimer - dt);
      if (this.nitroTimer > 0) this.nitroTimer = Math.max(0, this.nitroTimer - dt);
      if (this.invulnTimer > 0) this.invulnTimer = Math.max(0, this.invulnTimer - dt);
      if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 1.6);
      if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 0.8);
      if (this.clock - this.lastCoinAt >= 0.85) this.coinStreak = 0;

      const baseSpeed = this.level.speed + this.level.acceleration * this.runTime / CONFIG.speed.difficultyTimeScale;
      this.speed = baseSpeed + (this.nitroTimer > 0 ? CONFIG.powerups.nitroSpeedBonus : 0);
      const previous = this.distance;
      this.distance += this.speed * dt;
      if (this.level.goal) this.distance = Math.min(this.distance, this.level.goal);
      const coinsBefore = this.world.coins;
      this.world.movePlayer(this.player, dt, this.distance, previous);
      this.renderer.updateCamera(this.player, dt);
      const invulnActive = this.nitroTimer > 0 || this.invulnTimer > 0;
      const { crashed, nearMiss, pickedPowerup, shieldSaved } = this.world.update(
        this.distance, previous, this.speed, this.player, dt, this.magnetTimer > 0, invulnActive, this.shield
      );
      if (pickedPowerup) this.activatePowerup(pickedPowerup);
      if (shieldSaved) {
        this.shield = false;
        this.invulnTimer = CONFIG.powerups.shieldGrace;
        this.sound.playShieldBreak();
        this.vibrate(25);
        this.shake = this.reducedMotion.matches ? 0 : 0.28;
        this.addPopup("Щит спас!", COL.shield);
        if (!this.reducedMotion.matches) this.effects.emit("crash", this.player, this.distance, this.clock, 0.8);
      }
      this.updateFlightEffects(coinsBefore, crashed, nearMiss);
      if (!crashed && !this.recordBeaten && this.startBest > 0 && this.score > this.startBest) {
        this.recordBeaten = true;
        this.vibrate([18, 30, 32]);
        this.addPopup("Новый рекорд!", "#ffd15b");
      }
      if (crashed) this.beginCrash();
      else if (this.level.goal && this.distance >= this.level.goal) this.beginWin();
    }
    activatePowerup(kind) {
      this.sound.playPowerup(kind);
      this.vibrate(14);
      if (kind === "shield") {
        this.shield = true;
        this.addPopup("Щит!", COL.shield);
      } else if (kind === "magnet") {
        this.magnetTimer = CONFIG.powerups.magnetDuration;
        this.addPopup("Магнит!", COL.magnet);
      } else if (kind === "nitro") {
        this.nitroTimer = CONFIG.powerups.nitroDuration;
        this.addPopup("Нитро!", COL.nitro);
      }
    }
    updateFlightEffects(coinsBefore, collision, nearMiss) {
      const { player, distance, clock } = this;
      if (player.jumped) {
        this.sound.playJump();
      }
      if (player.landed) {
        this.sound.playLand(player.landImpact);
        if (player.landImpact > 0.65) this.vibrate(12);
      }
      if (this.world.coins > coinsBefore) {
        const gained = this.world.coins - coinsBefore;
        for (let i = 0; i < gained; i++) {
          if (clock - this.lastCoinAt < 0.85) {
            this.coinStreak = Math.min(this.coinStreak + 1, 10);
          } else {
            this.coinStreak = 1;
          }
          if (this.coinStreak > this.maxCoinStreak) this.maxCoinStreak = this.coinStreak;
          this.lastCoinAt = clock;
          this.sound.playCoin(this.coinStreak - 1);
          const bonus = Math.min(this.coinStreak - 1, 4) * 5;
          this.coinBonus += bonus;
        }
        if (this.coinStreak >= 3) {
          this.addPopup(`Серия ×${this.coinStreak}`, "#ffdf78", "streak");
        }
      }
      if (nearMiss && !collision) {
        this.sound.playNearMiss();
        this.vibrate(10);
        this.addPopup(`Впритирку +${CONFIG.game.nearMissScore}`, "#ff9f43");
      }
      if (player.landed && player.landedTrick && !collision) {
        this.tricks++;
        this.trickAt = clock;
        this.vibrate(15);
        this.addPopup(`Кувырок +${CONFIG.game.trickScore}`, this.skin.light);
      }
      if (!this.reducedMotion.matches) {
        this.effects.expire(clock);
        this.effects.sample(player, distance, clock);
        if (player.landed) this.effects.emit("landing", player, distance, clock, player.landedTrick ? 1.1 : 0.85);
        if (player.jumped) this.effects.emit("jump", player, distance, clock);
        if (this.world.coins > coinsBefore) this.effects.emit("coin", player, distance, clock, 0.5);
        if (collision) this.effects.emit("crash", player, distance, clock, 1);
      }
      while (this.popups.length && clock - this.popups[0].time > 0.95) this.popups.shift();
      player.jumped = false;
      player.landed = false;
    }
    draw() {
      const previewEffects = this.pendingEffectBuy
        ? { ...this.effects, selected: { ...this.effects.selected, [this.pendingEffectBuy.groupId]: this.pendingEffectBuy.value } }
        : this.effects;
      const streakRatio = this.coinStreak >= 2 ? clamp2(1 - (this.clock - this.lastCoinAt) / 0.85, 0, 1) : 0;
      this.renderer.render({
        distance: this.distance,
        time: this.clock,
        dayPhase: this.dayPhase,
        speed: this.speed,
        reducedMotion: this.reducedMotion.matches,
        demoTime: this.reducedMotion.matches ? 0 : this.demoTime,
        appearancePreview: this.screen === "skins" || this.screen === "effects",
        effectPreview: this.screen === "effects" && !this.reducedMotion.matches ? this.demoTime - this.previewStart : null,
        effects: previewEffects,
        coinStreak: this.coinStreak,
        coinStreakRatio: streakRatio,
        shield: this.shield,
        magnetTimer: this.magnetTimer,
        nitroTimer: this.nitroTimer,
        invulnTimer: this.invulnTimer,
        winTime: this.winTime,
        popups: this.popups,
        state: this.state,
        resumeTimer: this.resumeTimer,
        crashTime: this.crashTime,
        player: this.player,
        world: this.world,
        score: this.state === "menu" ? 0 : this.score,
        best: this.best,
        flash: this.flash,
        shake: this.shake
      });
    }
  };

  try {
    const game = new Game();
    game.draw();
    game.scheduleFrame();
    if (CONFIG.debug) window.game = game;
  } catch (error) {
    console.error(error);
    document.getElementById("menu-track").textContent = "Не удалось запустить игру. Обновите страницу.";
  }
})();
</script>
</body>
</html>
